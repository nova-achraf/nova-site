<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أفاينك — Afaynek</title>
<meta name="theme-color" content="#FF6B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="azami-apple-icon.png">
<style>
:root{
  --cream:#FFFBF6; --ink:#2E2A26; --muted:#93877D; --orange:#FF6B4A; --gold:#D4AF37;
  --line:#EFE7DD; --me:#FF6B4A; --them:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--cream); color:var(--ink); overflow:hidden;
  font-family:"Segoe UI",Tahoma,-apple-system,system-ui,sans-serif;
}
#app{max-width:480px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;background:var(--cream)}

/* ---------- conversations screen ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cream);
  transition:transform .26s cubic-bezier(.2,.8,.3,1);will-change:transform}
#chatScreen{transform:translateX(-100%)}
#chatScreen.on{transform:translateX(0)}
#homeScreen.off{transform:translateX(100%)}

header.top{
  padding:18px 18px 10px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(160deg,#FFF4EC 0%,#FFFBF6 70%);
  border-bottom:1px solid var(--line);
}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--orange),var(--gold));color:#fff;font-weight:800;font-size:19px;
  box-shadow:0 8px 18px rgba(255,107,74,.32)}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.search{padding:10px 14px 6px}
.search input{
  width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);
  background:#fff;font-size:14px;font-family:inherit;color:var(--ink);outline:none
}
.search input:focus{border-color:#FFD3C6;box-shadow:0 0 0 3px rgba(255,107,74,.1)}
.list{flex:1;overflow-y:auto;padding:4px 10px 90px}
.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:16px;cursor:pointer;transition:background .15s}
.row:active{background:#F6EFE7}
.av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:17px;position:relative}
.on-dot{position:absolute;bottom:1px;left:1px;width:12px;height:12px;border-radius:50%;
  background:#3ECF8E;border:2.5px solid var(--cream)}
.grow{flex:1;min-width:0}
.nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:11px;color:var(--muted);flex:none}
.ml{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--orange);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px}

.fab{position:absolute;left:18px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;
  background:linear-gradient(140deg,var(--orange),#FF8A6B);color:#fff;font-size:26px;cursor:pointer;
  box-shadow:0 12px 26px rgba(255,107,74,.42);display:grid;place-items:center}

/* ---------- chat screen ---------- */
#chatScreen{background:#FBF3EA}
.chead{display:flex;align-items:center;gap:10px;padding:12px 12px;background:#fff;
  border-bottom:1px solid var(--line);position:relative;z-index:3}
.back{width:36px;height:36px;border-radius:50%;border:0;background:#F7EFE7;font-size:18px;color:var(--ink);
  cursor:pointer;flex:none;display:grid;place-items:center}
.chead .av{width:42px;height:42px;font-size:15px}
.chead .who{flex:1;min-width:0}
.chead .who b{display:block;font-size:15px}
.chead .who i{font-style:normal;font-size:11.5px;color:#3ECF8E}
.chead .who i.off{color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:8px;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,107,74,.05),transparent 45%),
                   radial-gradient(circle at 80% 80%,rgba(212,175,55,.07),transparent 45%)}
.b{max-width:78%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.45;
  position:relative;word-wrap:break-word;box-shadow:0 1px 2px rgba(46,42,38,.06);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.b.them{background:#fff;border-bottom-right-radius:5px;align-self:flex-start}
.b.me{background:linear-gradient(140deg,#FF7A5C,#FF6B4A);color:#fff;border-bottom-left-radius:5px;align-self:flex-end}
.b .t{font-size:10px;opacity:.62;margin-top:3px;text-align:left;direction:ltr}
.day{text-align:center;font-size:11px;color:var(--muted);margin:6px 0}
.typing{align-self:flex-start;background:#fff;padding:12px 14px;border-radius:16px;border-bottom-right-radius:5px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#C9BDB2;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.composer{display:flex;align-items:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;border:1px solid var(--line);background:#FBF7F2;border-radius:22px;padding:11px 16px;
  font-size:14px;font-family:inherit;outline:none;color:var(--ink)}
.composer input:focus{border-color:#FFD3C6;background:#fff}
.cbtn{width:42px;height:42px;border-radius:50%;border:0;flex:none;font-size:18px;cursor:pointer;
  display:grid;place-items:center;background:#F7EFE7;color:var(--ink)}
.cbtn.send{background:linear-gradient(140deg,var(--orange),#FF8A6B);color:#fff;
  box-shadow:0 6px 16px rgba(255,107,74,.35)}
.hintbar{font-size:11px;color:var(--muted);text-align:center;padding:6px;background:#fff}

/* invite modal */
.modal{position:absolute;inset:0;background:rgba(46,42,38,.42);display:none;place-items:center;padding:24px;z-index:9}
.modal.on{display:grid}
.sheet{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 6px;font-size:16px}
.sheet p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.6}
.sheet input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;
  font-family:inherit;outline:none;margin-bottom:10px}
.sheet .row2{display:flex;gap:8px}
.sheet button{flex:1;padding:11px;border-radius:12px;border:0;font-family:inherit;font-size:14px;cursor:pointer}
.ok{background:var(--orange);color:#fff;font-weight:600}
.no{background:#F4EDE6;color:var(--ink)}
</style>
</head>
<body>
<div id="app">

  <!-- ======= home ======= -->
  <section class="screen" id="homeScreen">
    <header class="top">
      <div class="logo">أ</div>
      <div style="flex:1">
        <h1>أفاينك</h1>
        <div class="sub">Afaynek · فينك؟</div>
      </div>
    </header>
    <div class="search"><input id="q" placeholder="قلّب على شي حد…" autocomplete="off"></div>
    <div class="list" id="list"></div>
    <button class="fab" id="fab">✎</button>
  </section>

  <!-- ======= chat ======= -->
  <section class="screen" id="chatScreen">
    <div class="chead">
      <button class="back" id="back">›</button>
      <div class="av" id="cav">؟</div>
      <div class="who"><b id="cname">—</b><i id="cstat">متصل دابا</i></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <button class="cbtn" id="mic">🎤</button>
      <input id="inp" placeholder="كتب رسالة…" autocomplete="off">
      <button class="cbtn send" id="send">➤</button>
    </div>
  </section>

  <!-- ======= new chat ======= -->
  <div class="modal" id="modal">
    <div class="sheet">
      <h3>محادثة جديدة</h3>
      <p>سمّي المحادثة، وأفاينك غادي يجاوبك بحال صاحبك.</p>
      <input id="newName" placeholder="مثال: أمين" maxlength="18">
      <div class="row2">
        <button class="no" id="cancelNew">لا</button>
        <button class="ok" id="doNew">صاوب</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var KEY = 'afaynek_v1';
  var PALETTE = [
    ['#FF6B4A', '#FFB199'], ['#D4AF37', '#F3DFA0'], ['#7C6BFF', '#B9AEFF'],
    ['#3ECF8E', '#A8F0CD'], ['#FF8FB1', '#FFC9D9'], ['#4FA8FF', '#B7DCFF']
  ];
  var REPLY = [
    'واخا، صافي 👌', 'إيه! فين كنتي؟', 'ههههه راه قلبتيها عليا',
    'غادي نجي دغيا', 'شنو كتقصد؟', 'مزيان، عجبني هادشي',
    'خليها ليا، أنا كنشوف', 'وا سلام، توحشتك 😄', 'شكرا بزاف 🙏',
    'دابا كنسمع ليك، هضر'
  ];

  var app = { chats: [], openId: null };

  function now() { return Date.now(); }
  function hhmm(ts) {
    var d = new Date(ts);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); if (o && o.chats) { app.chats = o.chats; return; } }
    } catch (e) {}
    seed();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ chats: app.chats })); } catch (e) {}
  }
  function seed() {
    var t = now() - 3600 * 1000;
    app.chats = [
      { id: 'yassine', name: 'ياسين', msgs: [
        { f: 'them', x: 'وا أخويا، واش وصلاتك اللعبة الجديدة؟', t: t - 400000 },
        { f: 'me', x: 'إيه! جربتها، الزنقة ديال الموجات صعيبة 😅', t: t - 380000 },
        { f: 'them', x: 'هههههه راه غير البداية', t: t - 360000 }
      ] },
      { id: 'salma', name: 'سلمى', msgs: [
        { f: 'them', x: 'صافي، نتفقو غدا فالثالثة؟', t: t - 7200000 }
      ] },
      { id: 'groupe', name: 'صحاب القسم', msgs: [
        { f: 'them', x: 'الفرض ديال الرياضيات تأجل 😭', t: t - 9000000 }
      ] },
      { id: 'karim', name: 'كريم', msgs: [
        { f: 'me', x: 'صيفط ليا التصاور ديال حزمة التاتو', t: t - 86400000 * 2 }
      ] }
    ];
    save();
  }
  function initials(n) { return (n || '؟').trim().charAt(0); }
  function colorOf(id) {
    var s = 0;
    for (var i = 0; i < id.length; i++) s += id.charCodeAt(i);
    return PALETTE[s % PALETTE.length];
  }
  function last(c) { return c.msgs.length ? c.msgs[c.msgs.length - 1] : null; }
  function chatById(id) {
    for (var i = 0; i < app.chats.length; i++) if (app.chats[i].id === id) return app.chats[i];
    return null;
  }

  /* ---------- home list ---------- */
  var listEl = document.getElementById('list');
  var qEl = document.getElementById('q');

  function renderList() {
    var q = qEl.value.trim();
    var items = app.chats.slice().sort(function (a, b) {
      var la = last(a), lb = last(b);
      return (lb ? lb.t : 0) - (la ? la.t : 0);
    });
    listEl.innerHTML = '';
    var shown = 0;
    items.forEach(function (c) {
      if (q && c.name.indexOf(q) < 0) return;
      shown++;
      var l = last(c);
      var col = colorOf(c.id);
      var row = document.createElement('div');
      row.className = 'row';
      row.onclick = function () { openChat(c.id); };

      var av = document.createElement('div');
      av.className = 'av';
      av.style.background = 'linear-gradient(140deg,' + col[0] + ',' + col[1] + ')';
      av.textContent = initials(c.name);
      var dot = document.createElement('span');
      dot.className = 'on-dot';
      av.appendChild(dot);

      var grow = document.createElement('div');
      grow.className = 'grow';
      var nm = document.createElement('div');
      nm.className = 'nm';
      var b = document.createElement('b'); b.textContent = c.name;
      var sp = document.createElement('span'); sp.textContent = l ? hhmm(l.t) : '';
      nm.appendChild(b); nm.appendChild(sp);

      var ml = document.createElement('div');
      ml.className = 'ml';
      ml.textContent = l ? (l.f === 'me' ? 'أنت: ' : '') + l.x : 'بدا المحادثة…';

      grow.appendChild(nm); grow.appendChild(ml);
      row.appendChild(av); row.appendChild(grow);
      listEl.appendChild(row);
    });
    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = q ? 'ما لقيت حتى شي حد بهاد السمية.' : 'ما كاين حتى شي محادثة. دوس ✎ باش تبدا.';
      listEl.appendChild(e);
    }
  }

  /* ---------- chat ---------- */
  var msgsEl = document.getElementById('msgs');
  var inp = document.getElementById('inp');

  function openChat(id) {
    var c = chatById(id);
    if (!c) return;
    app.openId = id;
    document.getElementById('cname').textContent = c.name;
    var st = document.getElementById('cstat');
    st.textContent = 'متصل دابا';
    st.className = '';
    var av = document.getElementById('cav');
    var col = colorOf(c.id);
    av.style.background = 'linear-gradient(140deg,' + col[0] + ',' + col[1] + ')';
    av.textContent = initials(c.name);
    renderMsgs();
    document.getElementById('homeScreen').classList.add('off');
    document.getElementById('chatScreen').classList.add('on');
  }
  function closeChat() {
    document.getElementById('chatScreen').classList.remove('on');
    document.getElementById('homeScreen').classList.remove('off');
    app.openId = null;
    renderList();
  }
  function renderMsgs() {
    var c = chatById(app.openId);
    if (!c) return;
    msgsEl.innerHTML = '';
    var day = document.createElement('div');
    day.className = 'day';
    day.textContent = 'اليوم';
    msgsEl.appendChild(day);
    c.msgs.forEach(function (m) { msgsEl.appendChild(bubble(m)); });
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  function bubble(m) {
    var b = document.createElement('div');
    b.className = 'b ' + (m.f === 'me' ? 'me' : 'them');
    var txt = document.createElement('div');
    txt.textContent = m.x;
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = hhmm(m.t) + (m.f === 'me' ? ' ✓✓' : '');
    b.appendChild(txt); b.appendChild(t);
    return b;
  }
  function push(f, x) {
    var c = chatById(app.openId);
    if (!c) return;
    c.msgs.push({ f: f, x: x, t: now() });
    save();
    msgsEl.appendChild(bubble(c.msgs[c.msgs.length - 1]));
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  function botReply() {
    var c = chatById(app.openId);
    if (!c) return;
    var st = document.getElementById('cstat');
    st.textContent = 'كيكتب…';
    st.className = 'off';
    var tp = document.createElement('div');
    tp.className = 'typing';
    tp.innerHTML = '<i></i><i></i><i></i>';
    msgsEl.appendChild(tp);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    var id = c.id;
    setTimeout(function () {
      if (tp.parentNode) tp.parentNode.removeChild(tp);
      if (app.openId !== id) return;
      st.textContent = 'متصل دابا';
      st.className = '';
      push('them', REPLY[Math.floor(Math.random() * REPLY.length)]);
    }, 900 + Math.random() * 900);
  }

  function send() {
    var v = inp.value.trim();
    if (!v || !app.openId) return;
    inp.value = '';
    push('me', v);
    botReply();
  }

  document.getElementById('send').onclick = send;
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  document.getElementById('back').onclick = closeChat;
  document.getElementById('mic').onclick = function () {
    if (!app.openId) return;
    var secs = 2 + Math.floor(Math.random() * 12);
    push('me', '🎤 رسالة صوتية · 0:' + ('0' + secs).slice(-2));
    botReply();
  };

  qEl.addEventListener('input', renderList);

  document.getElementById('fab').onclick = function () {
    document.getElementById('newName').value = '';
    document.getElementById('modal').classList.add('on');
  };
  document.getElementById('cancelNew').onclick = function () {
    document.getElementById('modal').classList.remove('on');
  };
  document.getElementById('doNew').onclick = function () {
    var n = document.getElementById('newName').value.trim();
    if (!n) return;
    var id = 'u' + now();
    app.chats.push({ id: id, name: n, msgs: [] });
    save();
    document.getElementById('modal').classList.remove('on');
    renderList();
    openChat(id);
  };

  load();
  renderList();
})();
</script>
</body>
</html>
