<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أفاينك — Afaynek</title>
<meta name="theme-color" content="#FF6B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="azami-apple-icon.png">
<style>
:root{
  --cream:#FFFBF6; --ink:#2E2A26; --muted:#93877D; --orange:#FF6B4A; --gold:#D4AF37;
  --line:#EFE7DD; --soft:#F7EFE7; --orange2:var(--orange2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#EFE6DB;color:var(--ink);overflow:hidden;
  font-family:"Segoe UI",Tahoma,-apple-system,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;background:var(--cream);
  box-shadow:0 0 60px rgba(70,50,35,.14)}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cream);
  transition:transform .3s cubic-bezier(.2,.85,.3,1);will-change:transform}
#chatScreen{transform:translateX(-102%);z-index:2;box-shadow:-8px 0 30px rgba(60,40,25,.08)}
#chatScreen.on{transform:translateX(0)}
#homeScreen.off{transform:translateX(102%)}

/* ---------- home ---------- */
.top{position:relative;padding:20px 18px 14px;overflow:hidden;
  background:linear-gradient(150deg,#FFEDE3 0%,#FFF6EC 55%,#FFFBF6 100%);border-bottom:1px solid var(--line)}
.top:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;left:-60px;top:-90px;
  background:radial-gradient(circle,rgba(255,107,74,.22),transparent 70%)}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--orange),var(--gold));color:#fff;font-weight:800;font-size:21px;
  box-shadow:0 10px 22px rgba(255,107,74,.35)}
h1{font-size:20px;margin:0;letter-spacing:-.4px}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.tools{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.tools button{flex:1;border:0;background:#fff;border-radius:14px;padding:9px 8px;font-family:inherit;
  font-size:12.5px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 12px rgba(90,60,40,.07);cursor:pointer}
.tools button:active{transform:scale(.97)}
.search{padding:12px 16px 4px}
.search input{width:100%;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;
  font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:.18s}
.search input:focus{border-color:#FFD3C6;box-shadow:0 0 0 3px rgba(255,107,74,.1)}
.list{flex:1;overflow-y:auto;padding:6px 10px 96px}
.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:18px;cursor:pointer;transition:background .15s}
.row:active{background:var(--soft)}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:18px;position:relative;box-shadow:0 6px 14px rgba(60,40,25,.14)}
.on-dot{position:absolute;bottom:1px;left:1px;width:13px;height:13px;border-radius:50%;
  background:#3ECF8E;border:2.5px solid var(--cream)}
.grow{flex:1;min-width:0}
.nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:11px;color:var(--muted);flex:none}
.ml{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:44px 20px}
.fab{position:absolute;left:18px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;
  background:linear-gradient(140deg,var(--orange),var(--orange2));color:#fff;font-size:25px;cursor:pointer;
  box-shadow:0 14px 30px rgba(255,107,74,.45);display:grid;place-items:center;z-index:4}
.fab:active{transform:scale(.94)}

/* ---------- chat ---------- */
#chatScreen{background:#FBF3EA}
.chead{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#fff;
  border-bottom:1px solid var(--line);position:relative;z-index:3}
.back{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:19px;color:var(--ink);
  cursor:pointer;flex:none;display:grid;place-items:center}
.chead .av{width:42px;height:42px;font-size:15px;box-shadow:none}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px}
.who i{font-style:normal;font-size:11.5px;color:#2FBF83}
.who i.off{color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:17px;cursor:pointer;color:var(--ink)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 6px;display:flex;flex-direction:column;gap:8px;
  background-image:radial-gradient(circle at 18% 8%,rgba(255,107,74,.06),transparent 42%),
                   radial-gradient(circle at 85% 85%,rgba(212,175,55,.09),transparent 45%)}
.b{max-width:80%;padding:9px 12px;border-radius:17px;font-size:14px;line-height:1.45;position:relative;
  word-wrap:break-word;box-shadow:0 1px 3px rgba(46,42,38,.07);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(7px) scale(.98);opacity:.35}to{transform:none;opacity:1}}
.b.them{background:#fff;border-bottom-right-radius:6px;align-self:flex-start}
.b.me{background:linear-gradient(140deg,#FF7A5C,#FF6347);color:#fff;border-bottom-left-radius:6px;align-self:flex-end}
.b .t{font-size:10px;opacity:.6;margin-top:4px;text-align:left;direction:ltr}
.b.me .t{opacity:.8}
.b audio{width:190px;height:34px;max-width:100%;margin-top:2px;display:block}
.day{text-align:center;font-size:11px;color:var(--muted);margin:8px 0 4px}
.typing{align-self:flex-start;background:#fff;padding:13px 15px;border-radius:17px;border-bottom-right-radius:6px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#C9BDB2;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}

.composer{display:flex;align-items:center;gap:8px;padding:9px 9px calc(9px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:#FBF7F2;border-radius:22px;padding:11px 16px;
  font-size:14px;font-family:inherit;outline:none;color:var(--ink)}
.composer input:focus{border-color:#FFD3C6;background:#fff}
.cbtn{width:42px;height:42px;border-radius:50%;border:0;flex:none;font-size:18px;cursor:pointer;
  display:grid;place-items:center;background:var(--soft);color:var(--ink);transition:.15s}
.cbtn:active{transform:scale(.92)}
.cbtn.send{background:linear-gradient(140deg,var(--orange),var(--orange2));color:#fff;
  box-shadow:0 6px 16px rgba(255,107,74,.38)}
.cbtn.rec{background:#E8453C;color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,69,60,.45)}50%{box-shadow:0 0 0 12px rgba(232,69,60,0)}}

/* emoji panel */
.emoji{max-height:0;overflow:hidden;background:#fff;border-top:1px solid var(--line);transition:max-height .25s ease}
.emoji.on{max-height:190px;overflow-y:auto}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:10px}
.egrid button{border:0;background:transparent;font-size:23px;padding:6px 0;cursor:pointer;border-radius:10px}
.egrid button:active{background:var(--soft)}

/* sheets */
.modal{position:absolute;inset:0;background:rgba(46,42,38,.4);display:none;place-items:center;padding:22px;z-index:9}
.modal.on{display:grid}
.sheet{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:340px;
  box-shadow:0 22px 54px rgba(0,0,0,.22);animation:pop .2s ease-out}
.sheet h3{margin:0 0 6px;font-size:16px}
.sheet p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.6}
.sheet input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;
  font-family:inherit;outline:none;margin-bottom:10px}
.row2{display:flex;gap:8px}
.row2 button{flex:1;padding:11px;border-radius:12px;border:0;font-family:inherit;font-size:14px;cursor:pointer}
.ok{background:var(--orange);color:#fff;font-weight:600}
.no{background:#F4EDE6;color:var(--ink)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{width:100%;text-align:right;padding:13px 14px;border:0;border-radius:14px;background:#FAF5EF;
  font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center}
.menu button.danger{color:#D64545;background:#FDEDEC}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:rgba(46,42,38,.92);
  color:#fff;font-size:12.5px;padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:20;
  pointer-events:none;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">

  <!-- ======= home ======= -->
  <section class="screen" id="homeScreen">
    <div class="top">
      <div class="brand">
        <div class="logo">أ</div>
        <div style="flex:1">
          <h1>أفاينك</h1>
          <div class="sub">Afaynek · فينك؟</div>
        </div>
      </div>
      <div class="tools">
        <button id="shareApp">📤 بارطاج التطبيق</button>
        <button id="newChatTop">✎ محادثة جديدة</button>
        <button id="themeBtn">🎨 اللون</button>
      </div>
    </div>
    <div class="search"><input id="q" placeholder="قلّب على شي حد…" autocomplete="off"></div>
    <div class="list" id="list"></div>
    <button class="fab" id="fab">✎</button>
  </section>

  <!-- ======= chat ======= -->
  <section class="screen" id="chatScreen">
    <div class="chead">
      <button class="back" id="back">›</button>
      <div class="av" id="cav">؟</div>
      <div class="who"><b id="cname">—</b><i id="cstat">متصل دابا</i></div>
      <button class="iconbtn" id="chatMenu">⋮</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="emoji" id="emojiPanel"><div class="egrid" id="egrid"></div></div>
    <div class="composer">
      <button class="cbtn" id="emojiBtn">😊</button>
      <input id="inp" placeholder="كتب رسالة…" autocomplete="off">
      <button class="cbtn" id="mic">🎤</button>
      <button class="cbtn send" id="send">➤</button>
    </div>
  </section>

  <!-- ======= new chat ======= -->
  <div class="modal" id="modal">
    <div class="sheet">
      <h3>محادثة جديدة</h3>
      <p>سمّي المحادثة، وأفاينك غادي يجاوبك بحال صاحبك.</p>
      <input id="newName" placeholder="مثال: أمين" maxlength="18">
      <div class="row2">
        <button class="no" id="cancelNew">لا</button>
        <button class="ok" id="doNew">صاوب</button>
      </div>
    </div>
  </div>

  <!-- ======= chat menu ======= -->
  <div class="modal" id="menuModal">
    <div class="sheet">
      <h3 id="menuTitle">خيارات</h3>
      <div class="menu">
        <button id="mShare">📤 بارطاج هاد المحادثة</button>
        <button id="mCall">🎙 تسجيل صوتي</button>
        <button class="danger" id="mClear">🧹 حيّد الرسائل</button>
      </div>
      <div style="height:10px"></div>
      <div class="row2"><button class="no" id="menuClose">سد</button></div>
    </div>
  </div>

  <!-- ======= theme ======= -->
  <div class="modal" id="themeModal">
    <div class="sheet">
      <h3>🎨 لون التطبيق</h3>
      <p>اختار اللون اللي كيعجبك، وغادي يتبدل فكلشي — حتى أزرار والفقاعات.</p>
      <div id="swatches" style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px"></div>
      <label style="font-size:12px;color:#93877D;font-weight:600">لون آخر (من عندك)</label>
      <input id="customColor" type="color" value="#FF6B4A" style="width:100%;height:44px;border:1px solid #EFE7DD;border-radius:12px;background:#fff;margin:6px 0 12px;padding:3px">
      <div class="row2">
        <button class="no" id="themeReset">رجّع الأصلي</button>
        <button class="ok" id="themeClose">صافي</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'afaynek_v1';
  var PALETTE = [
    ['#FF6B4A', '#FFB199'], ['#D4AF37', '#F3DFA0'], ['#7C6BFF', '#B9AEFF'],
    ['#3ECF8E', '#A8F0CD'], ['#FF8FB1', '#FFC9D9'], ['#4FA8FF', '#B7DCFF']
  ];
  var REPLY = [
    'واخا، صافي 👌', 'إيه! فين كنتي؟', 'ههههه راه قلبتيها عليا 😂',
    'غادي نجي دغيا', 'شنو كتقصد؟', 'مزيان، عجبني هادشي 🔥',
    'خليها ليا، أنا كنشوف', 'وا سلام، توحشتك 😄', 'شكرا بزاف 🙏',
    'دابا كنسمع ليك، هضر'
  ];
  var EMOJIS = ('😀 😂 🤣 😊 😍 😘 😎 🤔 😴 😭 😡 🥳 👍 👏 🙏 💪 🔥 ✨ ❤️ 💔 ' +
    '😅 🙈 🫶 👀 🤝 🎉 🎮 🎧 ⚽ 🌙 ☀️ 🍕 ☕ 🍫 🚀 💡 📸 🎬 🎨 📚 ✍️ ⭐ 💯 ' +
    '😇 😜 🤗 🤩 🥺 😱 🤯 😬 🙃 🫡 🌹 🍀 🎁 🎯 🏆').split(' ');

  var app = { chats: [], openId: null };

  var $ = function (id) { return document.getElementById(id); };
  var now = function () { return Date.now(); };
  function hhmm(ts) {
    var d = new Date(ts);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(t._id);
    t._id = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); if (o && o.chats && o.chats.length) { app.chats = o.chats; return; } }
    } catch (e) {}
    seed();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ chats: app.chats })); }
    catch (e) { toast('الذاكرة عامرة — حيّد شي رسائل صوتية'); }
  }
  function seed() {
    var t = now() - 3600 * 1000;
    app.chats = [
      { id: 'yassine', name: 'ياسين', msgs: [
        { f: 'them', x: 'وا أخويا، واش وصلاتك اللعبة الجديدة؟', t: t - 400000 },
        { f: 'me', x: 'إيه! جربتها، الزنقة ديال الموجات صعيبة 😅', t: t - 380000 },
        { f: 'them', x: 'ههههه راه غير البداية 🔥', t: t - 360000 }
      ] },
      { id: 'salma', name: 'سلمى', msgs: [
        { f: 'them', x: 'صافي، نتفقو غدا فالثالثة؟', t: t - 7200000 }
      ] },
      { id: 'groupe', name: 'صحاب القسم', msgs: [
        { f: 'them', x: 'الفرض ديال الرياضيات تأجل 😭', t: t - 9000000 }
      ] },
      { id: 'karim', name: 'كريم', msgs: [
        { f: 'me', x: 'صيفط ليا التصاور ديال حزمة التاتو', t: t - 86400000 * 2 }
      ] }
    ];
    save();
  }
  function initials(n) { return (n || '؟').trim().charAt(0); }
  function colorOf(id) {
    var s = 0;
    for (var i = 0; i < id.length; i++) s += id.charCodeAt(i);
    return PALETTE[s % PALETTE.length];
  }
  function last(c) { return c.msgs.length ? c.msgs[c.msgs.length - 1] : null; }
  function chatById(id) {
    for (var i = 0; i < app.chats.length; i++) if (app.chats[i].id === id) return app.chats[i];
    return null;
  }
  function preview(m) {
    if (!m) return '';
    if (m.kind === 'audio') return '🎤 رسالة صوتية · ' + m.dur + '″';
    return m.x;
  }

  /* ---------- home ---------- */
  var listEl = $('list'), qEl = $('q');
  function renderList() {
    var q = qEl.value.trim();
    var items = app.chats.slice().sort(function (a, b) {
      var la = last(a), lb = last(b);
      return (lb ? lb.t : 0) - (la ? la.t : 0);
    });
    listEl.innerHTML = '';
    var shown = 0;
    items.forEach(function (c) {
      if (q && c.name.indexOf(q) < 0) return;
      shown++;
      var l = last(c), col = colorOf(c.id);
      var row = document.createElement('div');
      row.className = 'row';
      row.onclick = function () { openChat(c.id); };

      var av = document.createElement('div');
      av.className = 'av';
      av.style.background = 'linear-gradient(140deg,' + col[0] + ',' + col[1] + ')';
      av.textContent = initials(c.name);
      var dot = document.createElement('span');
      dot.className = 'on-dot';
      av.appendChild(dot);

      var grow = document.createElement('div');
      grow.className = 'grow';
      var nm = document.createElement('div');
      nm.className = 'nm';
      var b = document.createElement('b'); b.textContent = c.name;
      var sp = document.createElement('span'); sp.textContent = l ? hhmm(l.t) : '';
      nm.appendChild(b); nm.appendChild(sp);
      var ml = document.createElement('div');
      ml.className = 'ml';
      ml.textContent = l ? (l.f === 'me' ? 'أنت: ' : '') + preview(l) : 'بدا المحادثة…';
      grow.appendChild(nm); grow.appendChild(ml);
      row.appendChild(av); row.appendChild(grow);
      listEl.appendChild(row);
    });
    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = q ? 'ما لقيت حتى شي حد بهاد السمية.' : 'ما كاين حتى شي محادثة. دوس ✎ باش تبدا.';
      listEl.appendChild(e);
    }
  }

  /* ---------- chat ---------- */
  var msgsEl = $('msgs'), inp = $('inp');

  function openChat(id) {
    var c = chatById(id);
    if (!c) return;
    app.openId = id;
    $('cname').textContent = c.name;
    var st = $('cstat');
    st.textContent = 'متصل دابا'; st.className = '';
    var av = $('cav'), col = colorOf(c.id);
    av.style.background = 'linear-gradient(140deg,' + col[0] + ',' + col[1] + ')';
    av.textContent = initials(c.name);
    renderMsgs();
    $('homeScreen').classList.add('off');
    $('chatScreen').classList.add('on');
  }
  function closeChat() {
    $('chatScreen').classList.remove('on');
    $('homeScreen').classList.remove('off');
    $('emojiPanel').classList.remove('on');
    app.openId = null;
    renderList();
  }
  function renderMsgs() {
    var c = chatById(app.openId);
    if (!c) return;
    msgsEl.innerHTML = '';
    var day = document.createElement('div');
    day.className = 'day';
    day.textContent = 'اليوم';
    msgsEl.appendChild(day);
    c.msgs.forEach(function (m) { msgsEl.appendChild(bubble(m)); });
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  function bubble(m) {
    var b = document.createElement('div');
    b.className = 'b ' + (m.f === 'me' ? 'me' : 'them');

    if (m.kind === 'audio' && m.src) {
      var au = document.createElement('audio');
      au.controls = true;
      au.preload = 'metadata';
      au.src = m.src;
      b.appendChild(au);
    } else {
      var txt = document.createElement('div');
      txt.textContent = m.x;
      b.appendChild(txt);
    }
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = hhmm(m.t) + (m.f === 'me' ? ' ✓✓' : '');
    b.appendChild(t);
    return b;
  }
  function push(f, obj) {
    var c = chatById(app.openId);
    if (!c) return;
    var m = { f: f, t: now() };
    for (var k in obj) m[k] = obj[k];
    c.msgs.push(m);
    save();
    msgsEl.appendChild(bubble(m));
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  function botReply() {
    var c = chatById(app.openId);
    if (!c) return;
    var st = $('cstat');
    st.textContent = 'كيكتب…'; st.className = 'off';
    var tp = document.createElement('div');
    tp.className = 'typing';
    tp.innerHTML = '<i></i><i></i><i></i>';
    msgsEl.appendChild(tp);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    var id = c.id;
    setTimeout(function () {
      if (tp.parentNode) tp.parentNode.removeChild(tp);
      if (app.openId !== id) return;
      st.textContent = 'متصل دابا'; st.className = '';
      push('them', { x: REPLY[Math.floor(Math.random() * REPLY.length)] });
    }, 900 + Math.random() * 900);
  }
  function send() {
    var v = inp.value.trim();
    if (!v || !app.openId) return;
    inp.value = '';
    push('me', { x: v });
    botReply();
  }
  $('send').onclick = send;
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  $('back').onclick = closeChat;

  /* ---------- emoji ---------- */
  var grid = $('egrid');
  EMOJIS.forEach(function (e) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = e;
    b.onclick = function () {
      inp.value += e;
      inp.focus();
    };
    grid.appendChild(b);
  });
  $('emojiBtn').onclick = function () {
    $('emojiPanel').classList.toggle('on');
    if ($('emojiPanel').classList.contains('on')) setTimeout(function () { msgsEl.scrollTop = msgsEl.scrollHeight; }, 260);
  };

  /* ---------- voice recording ---------- */
  var rec = null, chunks = [], recStart = 0, recTimer = 0, micStream = null, recording = false;

  function stopTracks() {
    if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
  }
  function startRec() {
    if (!app.openId) { toast('حلّ شي محادثة أولاً'); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      toast('المتصفح ديالك ما كيدعمش التسجيل');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      micStream = stream;
      var mime = '';
      ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].some(function (m) {
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) { mime = m; return true; }
        return false;
      });
      rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      chunks = [];
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        var secs = Math.max(1, Math.round((Date.now() - recStart) / 1000));
        var blob = new Blob(chunks, { type: 'audio/webm' });
        stopTracks();
        if (!blob.size) { toast('ما تسجل حتى شي حاجة'); return; }
        var fr = new FileReader();
        fr.onload = function () {
          push('me', { kind: 'audio', src: fr.result, dur: secs, x: '' });
          botReply();
        };
        fr.readAsDataURL(blob);
      };
      rec.start();
      recording = true;
      recStart = Date.now();
      var btn = $('mic');
      btn.classList.add('rec');
      btn.textContent = '⏹';
      $('cstat').textContent = 'كنسجل…';
      recTimer = setInterval(function () {
        var s = Math.floor((Date.now() - recStart) / 1000);
        $('cstat').textContent = 'كنسجل… 0:' + ('0' + s).slice(-2);
        if (s >= 60) stopRec();
      }, 250);
    }).catch(function () {
      toast('ما قدرتش نوصل للميكروفون — عطي الإذن للصفحة');
    });
  }
  function stopRec() {
    if (!recording) return;
    recording = false;
    clearInterval(recTimer);
    var btn = $('mic');
    btn.classList.remove('rec');
    btn.textContent = '🎤';
    $('cstat').textContent = 'متصل دابا';
    try { rec.stop(); } catch (e) { stopTracks(); }
  }
  $('mic').onclick = function () { recording ? stopRec() : startRec(); };

  /* ---------- share ---------- */
  function shareWhat(text, title) {
    var data = { title: title || 'أفاينك', text: text, url: location.href };
    if (navigator.share) {
      navigator.share(data).catch(function () {});
      return;
    }
    copy(text + ' ' + location.href);
  }
  function copy(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast('تنسخ الرابط 📋'); },
        function () { toast('ما قدرتش ننسخ'); });
    } else {
      toast('ما قدرتش ننسخ فهاد المتصفح');
    }
  }
  $('shareApp').onclick = function () {
    shareWhat('جرب أفاينك — تطبيق ميساج بحال واتساب، ساهل وسريع 😍');
  };
  $('mShare').onclick = function () {
    var c = chatById(app.openId);
    $('menuModal').classList.remove('on');
    shareWhat(c ? ('شوف هاد المحادثة فـأفاينك: ' + c.name) : 'أفاينك');
  };
  $('mCall').onclick = function () {
    $('menuModal').classList.remove('on');
    startRec();
  };
  $('mClear').onclick = function () {
    var c = chatById(app.openId);
    if (!c) return;
    c.msgs = [];
    save(); renderMsgs();
    $('menuModal').classList.remove('on');
    toast('تحيدو الرسائل');
  };
  $('chatMenu').onclick = function () {
    var c = chatById(app.openId);
    $('menuTitle').textContent = c ? c.name : 'خيارات';
    $('menuModal').classList.add('on');
  };
  $('menuClose').onclick = function () { $('menuModal').classList.remove('on'); };

  /* ---------- new chat ---------- */
  $('fab').onclick = function () {
    $('newName').value = '';
    $('modal').classList.add('on');
    setTimeout(function () { $('newName').focus(); }, 120);
  };
  $('newChatTop').onclick = $('fab').onclick;
  $('cancelNew').onclick = function () { $('modal').classList.remove('on'); };
  $('doNew').onclick = function () {
    var n = $('newName').value.trim();
    if (!n) { toast('كتب سمية أولاً'); return; }
    var id = 'u' + now();
    app.chats.push({ id: id, name: n, msgs: [] });
    save();
    $('modal').classList.remove('on');
    renderList();
    openChat(id);
  };

  qEl.addEventListener('input', renderList);

  /* ---------- theme ---------- */
  var TKEY = 'afaynek_theme';
  var COLORS = ['#FF6B4A','#D4AF37','#7C6BFF','#3ECF8E','#4FA8FF','#FF4D8D','#F2545B',
                '#00B8A9','#8E44AD','#2D9CDB','#EB5757','#F2994A','#27AE60','#2F2F2F'];

  function shade(hex, p) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.min(255, Math.round(r + (255 - r) * p));
    g = Math.min(255, Math.round(g + (255 - g) * p));
    b = Math.min(255, Math.round(b + (255 - b) * p));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function applyColor(hex) {
    var root = document.documentElement.style;
    root.setProperty('--orange', hex);
    root.setProperty('--orange2', shade(hex, .22));
    root.setProperty('--gold', shade(hex, .55));
    try { localStorage.setItem(TKEY, hex); } catch (e) {}
    var cc = $('customColor');
    if (cc) cc.value = hex;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', hex);
  }
  function loadTheme() {
    var saved = null;
    try { saved = localStorage.getItem(TKEY); } catch (e) {}
    if (saved) applyColor(saved);
  }
  (function buildSwatches() {
    var box = $('swatches');
    COLORS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.style.cssText = 'height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);background:' + c + ';cursor:pointer';
      b.onclick = function () { applyColor(c); toast('تبدل اللون ✨'); };
      box.appendChild(b);
    });
  })();
  $('themeBtn').onclick = function () { $('themeModal').classList.add('on'); };
  $('themeClose').onclick = function () { $('themeModal').classList.remove('on'); };
  $('customColor').oninput = function () { applyColor(this.value); };
  $('themeReset').onclick = function () {
    try { localStorage.removeItem(TKEY); } catch (e) {}
    var r = document.documentElement.style;
    r.removeProperty('--orange'); r.removeProperty('--orange2'); r.removeProperty('--gold');
    $('customColor').value = '#FF6B4A';
    toast('رجع اللون الأصلي');
  };

  loadTheme();
  load();
  renderList();
})();
</script>
</body>
</html>
