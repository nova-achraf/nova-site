<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NOVA CITY — GTA Style</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#fff}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
  .pill{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:800}
  .money{color:#7CE8A2}
  .stars{color:#FFD25A;letter-spacing:1px}
  .mission{position:absolute;top:52px;left:12px;right:12px;text-align:center;font-size:12.5px;color:#d7e2ea;background:rgba(0,0,0,.45);border-radius:10px;padding:6px 10px;z-index:5;pointer-events:none;display:none}
  .mission.on{display:block}
  #load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0b0f14;z-index:20;font-size:14px;color:#9fb2c2}
  #load .bar{width:160px;height:5px;border-radius:9px;background:#1b2733;overflow:hidden}
  #load .bar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#00AEEC,#FB7299);animation:ld 1.1s infinite}
  @keyframes ld{0%{margin-left:-35%}100%{margin-left:100%}}
  .toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;z-index:8;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
  .toast.on{opacity:1}
  /* controls */
  #stick{position:absolute;left:18px;bottom:22px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);z-index:6;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.4)}
  #btnCar{position:absolute;right:18px;bottom:34px;width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#00AEEC,#FB7299);border:none;color:#fff;font-size:26px;font-weight:900;z-index:6;touch-action:none}
  #btnRun{position:absolute;right:100px;bottom:34px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;z-index:6;touch-action:none}
  .hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10.5px;color:#6b7d8c;z-index:4;pointer-events:none}
  #over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(5,8,12,.86);z-index:15;text-align:center;padding:20px}
  #over.on{display:flex}
  #over h1{font-size:26px;font-weight:900;letter-spacing:.04em}
  #over p{font-size:13px;color:#a9bac7;max-width:300px;line-height:1.7}
  #over button{background:linear-gradient(135deg,#00AEEC,#FB7299);border:none;color:#fff;font-weight:900;font-size:15px;padding:13px 26px;border-radius:14px;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="pill money">💵 <span id="money">0</span> درهم</div>
    <div class="pill stars" id="stars">☆☆☆☆☆</div>
    <div class="pill" style="margin-left:auto">🚗 <span id="carName">ماشي</span></div>
  </div>
  <div class="mission" id="mission"></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="btnCar">🚗</button>
  <button id="btnRun">🏃</button>
  <div class="toast" id="toast"></div>
  <div class="hint">WASD / الأسهم · E للطيارة ولا السيارة · Shift للجري</div>

  <div id="over">
    <h1 id="overTitle">NOVA CITY</h1>
    <p id="overText"></p>
    <button onclick="resetGame()">عاود من جديد</button>
  </div>

  <div id="load">
    <div>كنحمّل المدينة... 🏙️</div>
    <div class="bar"><i></i></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

/* ================== أساسيات ================== */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb6d9);
scene.fog = new THREE.Fog(0x8fb6d9, 90, 230);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ضو */
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x4a4a4a, 0.95));
const sun = new THREE.DirectionalLight(0xfff2d5, 1.15);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -90; sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90; sun.shadow.camera.bottom = -90;
sun.shadow.camera.far = 300;
scene.add(sun);

/* ================== المدينة ================== */
const CITY = 240;            // مقاس المدينة
const ROAD = 14;             // عرض الطريق
const BLOCK = 56;            // مقاس البلوك
const obstacles = [];        // صناديق التصادم {x1,x2,z1,z2}
// نقطة على طريق (باش ما نولدوش داخل بناية)
function randRoad() { return (Math.floor(Math.random() * 5) - 2) * BLOCK; }

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(CITY, CITY),
  new THREE.MeshLambertMaterial({ color: 0x2c3138 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* الأرصفة + العشب فكل بلوك */
const grassMat = new THREE.MeshLambertMaterial({ color: 0x3f6b46 });
const walkMat = new THREE.MeshLambertMaterial({ color: 0x9aa2ab });
const blockGeo = new THREE.BoxGeometry(BLOCK - ROAD, 0.3, BLOCK - ROAD);

function buildCity() {
  const half = CITY / 2;
  // الطرقات على مضاعفات BLOCK، والبلوكات بينهم
  const centers = [];
  for (let i = -2; i < 2; i++) centers.push(i * BLOCK + BLOCK / 2);

  // خطوط الطرق (خطوط بيضاء)
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xf0f0f0 });
  for (let i = -2; i <= 2; i++) {
    const p = i * BLOCK;
    if (Math.abs(p) > half - 1) continue;
    for (let k = -half + 3; k < half; k += 8) {
      const a = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 3.4), lineMat);
      a.rotation.x = -Math.PI / 2; a.position.set(p, 0.02, k + 1.5);
      scene.add(a);
      const b = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 0.6), lineMat);
      b.rotation.x = -Math.PI / 2; b.position.set(k + 1.5, 0.02, p);
      scene.add(b);
    }
  }

  centers.forEach((cx) => {
    centers.forEach((cz) => {
      const slab = new THREE.Mesh(blockGeo, walkMat);
      slab.position.set(cx, 0.15, cz);
      slab.receiveShadow = true;
      scene.add(slab);

      const pad = new THREE.Mesh(new THREE.BoxGeometry(BLOCK - ROAD - 10, 0.34, BLOCK - ROAD - 10), grassMat);
      pad.position.set(cx, 0.17, cz);
      pad.receiveShadow = true;
      scene.add(pad);

      // 4 بنايات فكل بلوك
      const spots = [
        [-10, -10], [10, -10], [-10, 10], [10, 10]
      ];
      spots.forEach(([ox, oz]) => {
        const w = 9 + Math.random() * 5;
        const d = 9 + Math.random() * 5;
        const h = 10 + Math.random() * 26;
        const col = new THREE.Color().setHSL(0.58, 0.06, 0.42 + Math.random() * 0.22);
        const b = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshLambertMaterial({ color: col })
        );
        b.position.set(cx + ox, h / 2 + 0.3, cz + oz);
        b.castShadow = true; b.receiveShadow = true;
        scene.add(b);
        obstacles.push({ x1: b.position.x - w / 2, x2: b.position.x + w / 2, z1: b.position.z - d / 2, z2: b.position.z + d / 2 });

        // شبابيك
        const winMat = new THREE.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.75 });
        const rows = Math.max(1, Math.floor(h / 5));
        for (let r = 0; r < rows; r++) {
          for (let c = -1; c <= 1; c++) {
            const win = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.9), winMat);
            win.position.set(b.position.x + c * 2.6, 3 + r * 5, b.position.z + d / 2 + 0.02);
            scene.add(win);
          }
        }
      });
    });
  });
}
buildCity();

/* شجر بسيط */
function addTree(x, z) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 2.4, 6), new THREE.MeshLambertMaterial({ color: 0x6b4a2b }));
  trunk.position.y = 1.2; t.add(trunk);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 7), new THREE.MeshLambertMaterial({ color: 0x3f8b4a }));
  leaf.position.y = 3.2; leaf.castShadow = true; t.add(leaf);
  t.position.set(x, 0.3, z);
  scene.add(t);
}
for (let i = 0; i < 26; i++) {
  addTree((Math.random() - 0.5) * (CITY - 40), (Math.random() - 0.5) * (CITY - 40));
}

/* ================== الشخصيات ================== */
let playerModel = null;
const player = {
  obj: new THREE.Group(),
  yaw: 0,
  speed: 0,
  mixer: null,
  actions: {},
  current: null,
  inCar: false,
  car: null
};
scene.add(player.obj);
player.obj.position.set(0, 0, 0);

function tintObject(root, hue) {
  root.traverse((o) => {
    if (o.isMesh && o.material) {
      o.material = o.material.clone();
      if (o.material.color) o.material.color.offsetHSL(hue, 0.02, 0);
    }
  });
}

function fitAndAdd(root, targetH = 1.8) {
  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3(); box.getSize(size);
  const s = targetH / (size.y || 1);
  root.scale.setScalar(s);
  root.position.y = -box.min.y * s;
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  return root;
}

function makeFallbackHuman() {
  const g = new THREE.Group();
  const skin = new THREE.MeshLambertMaterial({ color: 0xc98d63 });
  const shirt = new THREE.MeshLambertMaterial({ color: 0x3b6ea5 });
  const pants = new THREE.MeshLambertMaterial({ color: 0x2a2f38 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), skin);
  head.position.y = 1.66; g.add(head);
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.45, 4, 8), shirt);
  torso.position.y = 1.24; g.add(torso);
  const legs = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.55, 4, 8), pants);
  legs.position.y = 0.55; g.add(legs);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

const npcs = [];
const NPC_COUNT = 9;
let clips = null;
let baseModel = null;

const loader = new GLTFLoader();
loader.load('./models/Soldier.glb', (gltf) => {
  baseModel = gltf.scene;
  clips = gltf.animations;

  // اللاعب
  playerModel = fitAndAdd(skeletonClone(baseModel), 1.82);
  player.obj.add(playerModel);
  player.mixer = new THREE.AnimationMixer(playerModel);
  clips.forEach((c) => { player.actions[c.name] = player.mixer.clipAction(c); });
  player.mixer.clipAction?.(clips[0]);
  playAnim(player, 'Idle');

  // NPCs
  for (let i = 0; i < NPC_COUNT; i++) {
    const m = fitAndAdd(skeletonClone(baseModel), 1.7 + Math.random() * 0.15);
    tintObject(m, Math.random() * 0.9 - 0.45);
    const obj = new THREE.Group();
    obj.add(m);
    const angle = Math.random() * Math.PI * 2;
    obj.position.set(randRoad(), 0, (Math.random() - 0.5) * CITY * 0.75);
    scene.add(obj);
    const mixer = new THREE.AnimationMixer(m);
    const acts = {};
    clips.forEach((c) => { acts[c.name] = mixer.clipAction(c); });
    const npc = {
      obj, mixer, acts, dir: angle, speed: 1.1 + Math.random() * 0.7,
      flee: 0, down: false, timer: Math.random() * 3
    };
    playAnim({ mixer, actions: acts, current: null }, 'Walk');
    npcs.push(npc);
  }

  document.getElementById('load').style.display = 'none';
  showToast('مرحبا فـNOVA CITY 🏙️');
}, undefined, (err) => {
  console.warn('GLB fail', err);
  // خطة بديلة: شخصيات بالأشكال
  playerModel = makeFallbackHuman();
  player.obj.add(playerModel);
  for (let i = 0; i < NPC_COUNT; i++) {
    const m = makeFallbackHuman();
    const obj = new THREE.Group();
    obj.add(m);
    obj.position.set(randRoad(), 0, (Math.random() - 0.5) * CITY * 0.7);
    scene.add(obj);
    npcs.push({ obj, mixer: null, acts: null, dir: Math.random() * 6.28, speed: 1.2, flee: 0, down: false });
  }
  document.getElementById('load').style.display = 'none';
});

function playAnim(ent, name) {
  if (!ent.actions || !ent.actions[name]) return;
  if (ent.current === name) return;
  const next = ent.actions[name];
  if (ent.current && ent.actions[ent.current]) ent.actions[ent.current].fadeOut(0.18);
  next.reset().fadeIn(0.18).play();
  ent.current = name;
}

/* ================== السيارات ================== */
const cars = [];
const CAR_COLORS = [0xd94b4b, 0x2f6fd0, 0xf0c14b, 0x2fbf84, 0x8b5cf6, 0xdddddd, 0x22c1c3];

function makeCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.72, 4.3), new THREE.MeshLambertMaterial({ color }));
  body.position.y = 0.76; body.castShadow = true; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.62, 2.1), new THREE.MeshLambertMaterial({ color: 0x1c2530 }));
  cabin.position.set(0, 1.36, -0.1); cabin.castShadow = true; g.add(cabin);
  const wheelG = new THREE.CylinderGeometry(0.42, 0.42, 0.34, 12);
  const wheelM = new THREE.MeshLambertMaterial({ color: 0x14181d });
  [[-1, 1.4], [1, 1.4], [-1, -1.4], [1, -1.4]].forEach(([x, z]) => {
    const w = new THREE.Mesh(wheelG, wheelM);
    w.rotation.z = Math.PI / 2;
    w.position.set(x * 1.02, 0.42, z);
    g.add(w);
  });
  const lamp = new THREE.MeshBasicMaterial({ color: 0xfff6cc });
  [[-0.7, 2.16], [0.7, 2.16]].forEach(([x, z]) => {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.08), lamp);
    l.position.set(x, 0.85, z); g.add(l);
  });
  g.userData = { color };
  return g;
}

function spawnCars() {
  for (let i = 0; i < 7; i++) {
    const c = makeCar(CAR_COLORS[i % CAR_COLORS.length]);
    const onX = Math.random() > 0.5;
    const p = randRoad() + 3;
    c.position.set(
      onX ? p : (Math.random() - 0.5) * CITY * 0.8,
      0,
      onX ? (Math.random() - 0.5) * CITY * 0.8 : p
    );
    c.rotation.y = onX ? 0 : Math.PI / 2;
    scene.add(c);
    cars.push({ obj: c, speed: 0, yaw: c.rotation.y, color: CAR_COLORS[i % CAR_COLORS.length] });
  }
}
spawnCars();

/* سيارة الشرطة */
const police = { obj: makeCar(0x101820), speed: 0, active: false };
police.obj.visible = false;
const sirenMat = new THREE.MeshBasicMaterial({ color: 0xff2d55 });
const siren = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.18, 0.3), sirenMat);
siren.position.set(0, 1.78, 0);
police.obj.add(siren);
scene.add(police.obj);

/* ================== الفلوس ================== */
const pickups = [];
function spawnPickups() {
  for (let i = 0; i < 7; i++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.35, 1.9),
      new THREE.MeshLambertMaterial({ color: 0x4fe08a, emissive: 0x1d6a3d })
    );
    m.position.set(randRoad() + 4, 0.6, (Math.random() - 0.5) * (CITY - 40));
    scene.add(m);
    pickups.push(m);
  }
}
spawnPickups();

/* ================== التحكم ================== */
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e') toggleCar();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

let joy = { x: 0, y: 0 };
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');
let stickId = null;

function stickMove(ev) {
  const r = stick.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  let dx = (t.clientX - (r.left + r.width / 2)) / (r.width / 2);
  let dy = (t.clientY - (r.top + r.height / 2)) / (r.height / 2);
  const len = Math.hypot(dx, dy) || 1;
  if (len > 1) { dx /= len; dy /= len; }
  joy.x = dx; joy.y = dy;
  knob.style.transform = `translate(${dx * 32}px, ${dy * 32}px)`;
}
stick.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
stick.addEventListener('pointermove', (e) => { if (stickId === e.pointerId) stickMove(e); });
function stickEnd() { stickId = null; joy.x = 0; joy.y = 0; knob.style.transform = 'none'; }
stick.addEventListener('pointerup', stickEnd);
stick.addEventListener('pointercancel', stickEnd);

document.getElementById('btnCar').addEventListener('click', toggleCar);
let running = false;
const runBtn = document.getElementById('btnRun');
runBtn.addEventListener('click', () => { running = !running; runBtn.style.background = running ? 'rgba(124,232,162,.35)' : 'rgba(255,255,255,.14)'; });

/* ================== الحالة ================== */
const state = { money: 0, wanted: 0, missionDone: 0, busted: false };
const moneyEl = document.getElementById('money');
const starsEl = document.getElementById('stars');
const carNameEl = document.getElementById('carName');
const missionEl = document.getElementById('mission');

function showMission(txt) {
  missionEl.textContent = txt;
  missionEl.classList.add('on');
}
function hideMission() { missionEl.classList.remove('on'); }

let toastT = null;
function showToast(txt) {
  const el = document.getElementById('toast');
  el.textContent = txt; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 1800);
}

function updateStars() {
  const n = Math.min(5, state.wanted);
  starsEl.textContent = '★'.repeat(n) + '☆'.repeat(5 - n);
}

/* ================== تصادم ================== */
function blocked(x, z, r = 0.6) {
  for (const o of obstacles) {
    if (x + r > o.x1 && x - r < o.x2 && z + r > o.z1 && z - r < o.z2) return true;
  }
  const lim = CITY / 2 - 2;
  if (Math.abs(x) > lim || Math.abs(z) > lim) return true;
  return false;
}

/* ================== ركوب السيارة ================== */
function nearestCar() {
  let best = null, bd = 4.2;
  cars.forEach((c) => {
    const d = c.obj.position.distanceTo(player.obj.position);
    if (d < bd) { bd = d; best = c; }
  });
  return best;
}

function toggleCar() {
  if (state.busted) return;
  if (player.inCar) {
    const c = player.car;
    player.inCar = false;
    player.obj.visible = true;
    player.obj.position.set(c.obj.position.x - Math.sin(c.yaw) * 2.4, 0, c.obj.position.z - Math.cos(c.yaw) * 2.4);
    c.speed = 0;
    player.car = null;
    carNameEl.textContent = 'ماشي';
    return;
  }
  const c = nearestCar();
  if (!c) { showToast('ما كايناش سيارة قريبة 🚗'); return; }
  player.inCar = true;
  player.car = c;
  player.obj.visible = false;
  carNameEl.textContent = 'سيارة';
  showToast('ركبت! W للسير · A/D للتحكم · E للهبوط');
}

/* ================== الجري والحركة ================== */
const clock = new THREE.Clock();
let camYaw = 0;

function tryMove(obj, nx, nz, r) {
  if (!blocked(nx, obj.position.z, r)) obj.position.x = nx;
  if (!blocked(obj.position.x, nz, r)) obj.position.z = nz;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!state.busted) {
    /* ===== حركة اللاعب ===== */
    if (!player.inCar) {
      const fwdInput = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) - joy.y;
      const turnInput = (keys['a'] || keys['arrowleft'] ? 1 : 0) - (keys['d'] || keys['arrowright'] ? 1 : 0) - joy.x;
      const sprint = keys['shift'] || running;

      player.yaw += turnInput * dt * 2.6;
      const target = Math.max(-1, Math.min(1, fwdInput));
      const spd = (sprint ? 6.2 : 2.9) * Math.abs(target);
      player.obj.rotation.y = player.yaw;

      if (Math.abs(target) > 0.05) {
        const nx = player.obj.position.x + Math.sin(player.yaw) * spd * dt * Math.sign(target);
        const nz = player.obj.position.z + Math.cos(player.yaw) * spd * dt * Math.sign(target);
        tryMove(player.obj, nx, nz, 0.55);
        playAnim(player, sprint ? 'Run' : 'Walk');
      } else {
        playAnim(player, 'Idle');
      }
      player.mixer && player.mixer.update(dt);
    } else {
      /* ===== السيارة ===== */
      const c = player.car;
      const acc = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) - joy.y;
      const steer = (keys['a'] || keys['arrowleft'] ? 1 : 0) - (keys['d'] || keys['arrowright'] ? 1 : 0) - joy.x;
      c.speed += acc * 14 * dt;
      c.speed *= 0.985;
      c.speed = Math.max(-9, Math.min(24, c.speed));
      if (Math.abs(c.speed) > 0.2) c.yaw += steer * dt * 1.9 * Math.min(1, Math.abs(c.speed) / 8);
      const nx = c.obj.position.x + Math.sin(c.yaw) * c.speed * dt;
      const nz = c.obj.position.z + Math.cos(c.yaw) * c.speed * dt;
      if (!blocked(nx, nz, 1.3)) {
        c.obj.position.x = nx; c.obj.position.z = nz;
      } else { c.speed *= -0.25; }
      c.obj.rotation.y = c.yaw;
      player.obj.position.copy(c.obj.position);
      player.obj.rotation.y = c.yaw;
      player.obj.visible = false;
      if (Math.abs(c.speed) > 6) playAnim(player, 'Idle');
    }

    /* ===== NPCs ===== */
    npcs.forEach((n) => {
      if (n.down) return;
      const d = n.obj.position.distanceTo(player.obj.position);
      n.timer -= dt;
      if (n.timer <= 0) {
        n.timer = 2 + Math.random() * 3;
        n.dir += (Math.random() - 0.5) * 1.6;
      }
      const fleeing = d < 9;
      const spd = fleeing ? n.speed * 2.3 : n.speed;
      const nx = n.obj.position.x + Math.sin(n.dir) * spd * dt;
      const nz = n.obj.position.z + Math.cos(n.dir) * spd * dt;
      if (blocked(nx, nz, 0.5) || Math.abs(nx) > CITY / 2 - 3 || Math.abs(nz) > CITY / 2 - 3) {
        n.dir += Math.PI * 0.7;
      } else {
        n.obj.position.x = nx; n.obj.position.z = nz;
      }
      n.obj.rotation.y = n.dir;
      if (n.acts) {
        if (n.current !== (fleeing ? 'Run' : 'Walk')) {
          if (n.current && n.acts[n.current]) n.acts[n.current].fadeOut(0.2);
          const a = n.acts[fleeing ? 'Run' : 'Walk'] || n.acts['Walk'];
          if (a) { a.reset().fadeIn(0.2).play(); n.current = fleeing ? 'Run' : 'Walk'; }
        }
        n.mixer.update(dt);
      }
      // صدم NPC بالسيارة
      if (player.inCar && player.car && Math.abs(player.car.speed) > 5 && d < 2.6) {
        n.down = true;
        n.obj.rotation.z = Math.PI / 2;
        state.wanted = Math.min(5, state.wanted + 1);
        updateStars();
        showToast('واحد تصدم! 👮 الشرطة فطريقها');
        startPolice();
      }
    });

    /* ===== الشرطة ===== */
    if (police.active) {
      const target = player.obj.position;
      const dir = new THREE.Vector3().subVectors(target, police.obj.position);
      dir.y = 0;
      const dist = dir.length();
      if (dist > 3) {
        dir.normalize();
        police.speed = Math.min(20, police.speed + dt * 10);
        const nx = police.obj.position.x + dir.x * police.speed * dt;
        const nz = police.obj.position.z + dir.z * police.speed * dt;
        if (!blocked(nx, nz, 1.2)) { police.obj.position.x = nx; police.obj.position.z = nz; }
        police.obj.rotation.y = Math.atan2(dir.x, dir.z);
      } else {
        bust()
      }
      sirenMat.color.setHex(Math.floor(performance.now() / 260) % 2 ? 0xff2d55 : 0x2d6bff);
    }

    /* ===== الفلوس ===== */
    pickups.forEach((p) => {
      if (!p.visible) return;
      p.rotation.y += dt * 2.2;
      p.position.y = 0.6 + Math.sin(performance.now() / 400) * 0.16;
      if (p.position.distanceTo(player.obj.position) < 2.2) {
        p.visible = false;
        state.money += 50;
        state.missionDone++;
        moneyEl.textContent = state.money;
        if (state.missionDone >= pickups.length) {
          showToast('كملتي كل الفلوس! 🎉 ' + state.money + ' درهم');
        } else {
          showToast('+50 درهم 💵 (' + state.missionDone + '/' + pickups.length + ')');
        }
      }
    });
  }

  /* ===== الكاميرا ===== */
  const focus = player.obj.position;
  const yaw = player.inCar && player.car ? player.car.yaw : player.yaw;
  camYaw += (yaw - camYaw) * Math.min(1, dt * 4);
  const back = player.inCar ? 9.5 : 5.2;
  const up = player.inCar ? 5.2 : 3.2;
  const camX = focus.x - Math.sin(camYaw) * back;
  const camZ = focus.z - Math.cos(camYaw) * back;
  camera.position.lerp(new THREE.Vector3(camX, focus.y + up, camZ), Math.min(1, dt * 5));
  camera.lookAt(focus.x, focus.y + 1.5, focus.z);

  renderer.render(scene, camera);
}
animate();

function startPolice() {
  if (police.active) return;
  police.active = true;
  police.obj.visible = true;
  police.speed = 0;
  const a = Math.random() * Math.PI * 2;
  police.obj.position.set(player.obj.position.x + Math.sin(a) * 60, 0, player.obj.position.z + Math.cos(a) * 60);
}

function bust() {
  state.busted = true;
  police.active = false;
  document.getElementById('overTitle').textContent = '⛔ شدّوك!';
  document.getElementById('overText').textContent =
    'الشرطة شدّاتك. عندك ' + state.money + ' درهم. جرّب مرة أخرى بلا ما تصدم الناس 😅';
  document.getElementById('over').classList.add('on');
}

window.resetGame = function () {
  state.busted = false;
  state.wanted = 0;
  state.money = 0;
  state.missionDone = 0;
  moneyEl.textContent = '0';
  updateStars();
  police.active = false;
  police.obj.visible = false;
  player.inCar = false;
  player.obj.visible = true;
  player.obj.position.set(0, 0, 0);
  player.yaw = 0;
  player.car = null;
  carNameEl.textContent = 'ماشي';
  hideMission();
  pickups.forEach((p, i) => {
    p.visible = true;
    p.position.set(randRoad() + 4, 0.6, (Math.random() - 0.5) * (CITY - 40));
  });
  npcs.forEach((n) => { n.down = false; n.obj.rotation.z = 0; });
  document.getElementById('over').classList.remove('on');
  showToast('عاود بدا 🚀');
};

updateStars();
showMission('🎯 مهمتك: جمع 7 ديال الفلوس الخضراء (كل وحدة +50 درهم)');
</script>
