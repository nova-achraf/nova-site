<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مذكرة المواعيد — أفاينك</title>
<meta name="theme-color" content="#1B4B8F">
<link rel="apple-touch-icon" href="afaynek-memo-icon.png">
<style>
:root{
  --bg:#FFFFFF; --ink:#14181F; --soft:#F1F4F9; --line:#D7DDE7;
  --blue:#1B4B8F; --blue2:#2A63B8; --green:#0F7B3F; --red:#B3261E; --amber:#B26B00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",Tahoma,-apple-system,system-ui,sans-serif;
  font-size:20px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}

h1{font-size:30px;line-height:1.25;margin:0 0 4px;letter-spacing:-.3px}
.sub{font-size:16px;color:#4A5462;margin:0 0 18px}

/* big, unmistakable buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;min-height:76px;padding:16px 20px;border-radius:20px;border:3px solid transparent;
  font-family:inherit;font-size:24px;font-weight:800;cursor:pointer;letter-spacing:-.2px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 0 #12356A}
.btn.primary:active{box-shadow:0 4px 0 #12356A;transform:translateY(3px)}
.btn.secondary{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn.ghost{background:var(--soft);color:var(--ink);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn .ic{font-size:30px;line-height:1}

.card{background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px;margin:0 0 16px}
.card.next{border-color:var(--blue);background:#F6FAFF}

/* appointment card */
.appt{display:flex;gap:16px;align-items:flex-start}
.when{
  flex:none;width:104px;text-align:center;background:var(--blue);color:#fff;border-radius:18px;
  padding:10px 6px
}
.when .d{font-size:15px;font-weight:700;opacity:.9}
.when .h{font-size:26px;font-weight:800;letter-spacing:-.5px}
.body{flex:1;min-width:0}
.title{font-size:24px;font-weight:800;line-height:1.3;word-wrap:break-word}
.note{font-size:17px;color:#4A5462;margin-top:6px;word-wrap:break-word}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.acts button{
  flex:1;min-height:56px;border-radius:16px;border:2px solid var(--line);background:#fff;
  font-family:inherit;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px
}
.acts button.say{color:var(--blue);border-color:var(--blue)}
.acts button.del{color:var(--red);border-color:#F0C9C6}

/* labels + inputs */
label{display:block;font-size:18px;font-weight:800;margin:0 0 8px}
input,textarea,select{
  width:100%;padding:16px 18px;border-radius:16px;border:3px solid var(--line);background:#fff;
  font-family:inherit;font-size:22px;font-weight:600;color:var(--ink);outline:none
}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:#F6FAFF}
textarea{min-height:88px;resize:vertical;font-weight:500;font-size:20px}
.field{margin-bottom:18px}
.two{display:flex;gap:12px}
.two>.field{flex:1;margin-bottom:0}
.quick{display:flex;gap:10px;margin:10px 0 18px;flex-wrap:wrap}
.quick button{
  flex:1;min-width:130px;min-height:60px;border-radius:16px;border:3px dashed var(--line);background:#FAFBFD;
  font-family:inherit;font-size:17px;font-weight:700;color:var(--blue);cursor:pointer
}
.empty{text-align:center;padding:26px 14px;color:#4A5462;font-size:19px}
.banner{
  display:flex;gap:14px;align-items:center;background:#FFF6E5;border:3px solid var(--amber);
  border-radius:20px;padding:16px;margin-bottom:18px;font-size:17px;font-weight:700;color:#6B4100
}
.banner .ic{font-size:28px}
.section-h{font-size:22px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.fab-add{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;
  border:0;background:var(--green);color:#fff;font-size:38px;font-weight:800;cursor:pointer;
  box-shadow:0 10px 24px rgba(15,123,63,.4);display:grid;place-items:center;z-index:8}
.sheet{position:fixed;inset:0;background:rgba(20,24,31,.55);display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.panel{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:92dvh;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.panel h2{font-size:24px;margin:0 0 16px}
.ring{position:fixed;inset:0;background:rgba(20,24,31,.72);display:none;place-items:center;z-index:20;padding:22px}
.ring.on{display:grid}
.ring .box{background:#fff;border-radius:26px;padding:26px;text-align:center;max-width:400px;width:100%}
.ring .big{font-size:56px;margin-bottom:10px}
.ring h3{font-size:26px;margin:0 0 8px}
.ring p{font-size:19px;margin:0 0 18px;color:#4A5462}
</style>
</head>
<body>
<div class="wrap">
  <h1>مذكرة المواعيد</h1>
  <p class="sub">دواء، طبيب، زيارة… كلشي مكتوب وكيذكّرك فالوقت.</p>

  <div class="banner"><span class="ic">🔊</span><span>كل شي كبير وواضح. دوس على «سمعني» باش تسمع الموعد.</span></div>

  <div class="section-h">⏰ الموعد الجاي</div>
  <div id="nextBox"></div>

  <div class="section-h">📋 كل المواعيد</div>
  <div id="listBox"></div>

  <div style="height:90px"></div>
</div>

<button class="fab-add" id="addBtn" aria-label="زيد موعد">＋</button>

<!-- add sheet -->
<div class="sheet" id="sheet">
  <div class="panel">
    <h2>موعد جديد</h2>

    <div class="field">
      <label for="t">شنو هو الموعد؟</label>
      <input id="t" placeholder="مثال: حبة الدواء" maxlength="40">
    </div>

    <div class="quick">
      <button data-q="pill">💊 دواء</button>
      <button data-q="doc">🩺 طبيب</button>
      <button data-q="fam">👨‍👩‍👦 زيارة</button>
      <button data-q="eat">🍲 ماكلة</button>
    </div>

    <div class="two">
      <div class="field">
        <label for="d">النهار</label>
        <input id="d" type="date">
      </div>
      <div class="field">
        <label for="h">الساعة</label>
        <input id="h" type="time">
      </div>
    </div>

    <div class="quick" style="margin-top:16px">
      <button data-w="60">بعد ساعة</button>
      <button data-w="180">بعد 3 سوايع</button>
      <button data-w="1440">غدا</button>
    </div>

    <div class="field">
      <label for="n">ملاحظة (اختياري)</label>
      <textarea id="n" placeholder="مثال: حبة وحدة مع الما"></textarea>
    </div>

    <button class="btn primary" id="saveBtn"><span class="ic">✓</span> سجّل الموعد</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="closeBtn">سد</button>
  </div>
</div>

<!-- ringing -->
<div class="ring" id="ring">
  <div class="box">
    <div class="big">⏰</div>
    <h3 id="ringTitle">الوقت داز</h3>
    <p id="ringNote"></p>
    <button class="btn primary" id="ringOk"><span class="ic">✓</span> واخا، شفتو</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'afaynek_memo_v1';
  var $ = function (id) { return document.getElementById(id); };
  var items = [];
  var spoken = {};

  function load() {
    try { var r = localStorage.getItem(KEY); if (r) items = JSON.parse(r) || []; } catch (e) { items = []; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }

  function fmtDay(ts) {
    var d = new Date(ts), n = new Date();
    var sameDay = d.toDateString() === n.toDateString();
    var tom = new Date(n.getTime() + 86400000);
    if (sameDay) return 'اليوم';
    if (d.toDateString() === tom.toDateString()) return 'غدا';
    var days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    return days[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    var ap = h < 12 ? 'صباحاً' : 'مساءً';
    var hh = h % 12; if (hh === 0) hh = 12;
    return hh + ':' + ('0' + m).slice(-2) + ' ' + ap;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return false;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar-SA';
      u.rate = 0.85;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }

  function sorted() {
    return items.slice().sort(function (a, b) { return a.ts - b.ts; });
  }

  function card(it, isNext) {
    var c = document.createElement('div');
    c.className = 'card' + (isNext ? ' next' : '');

    var row = document.createElement('div');
    row.className = 'appt';

    var when = document.createElement('div');
    when.className = 'when';
    var d1 = document.createElement('div'); d1.className = 'd'; d1.textContent = fmtDay(it.ts);
    var d2 = document.createElement('div'); d2.className = 'h'; d2.textContent = fmtTime(it.ts);
    when.appendChild(d1); when.appendChild(d2);

    var body = document.createElement('div');
    body.className = 'body';
    var t = document.createElement('div');
    t.className = 'title';
    t.textContent = it.title;
    body.appendChild(t);
    if (it.note) {
      var n = document.createElement('div');
      n.className = 'note';
      n.textContent = it.note;
      body.appendChild(n);
    }

    row.appendChild(when); row.appendChild(body);
    c.appendChild(row);

    var acts = document.createElement('div');
    acts.className = 'acts';

    var say = document.createElement('button');
    say.className = 'say';
    say.innerHTML = '<span>🔊</span> سمعني';
    say.onclick = function () {
      speak(it.title + '. ' + fmtDay(it.ts) + ' فـ ' + fmtTime(it.ts) + (it.note ? '. ' + it.note : ''));
    };

    var del = document.createElement('button');
    del.className = 'del';
    del.innerHTML = '<span>🗑</span> حيّد';
    del.onclick = function () {
      items = items.filter(function (x) { return x.id !== it.id; });
      save(); render();
    };

    acts.appendChild(say); acts.appendChild(del);
    c.appendChild(acts);
    return c;
  }

  function render() {
    var now = Date.now();
    var arr = sorted();
    var upcoming = arr.filter(function (x) { return x.ts >= now - 60000; });

    var nextBox = $('nextBox');
    nextBox.innerHTML = '';
    if (upcoming.length) {
      nextBox.appendChild(card(upcoming[0], true));
    } else {
      var e = document.createElement('div');
      e.className = 'card empty';
      e.textContent = 'ما كاين حتى شي موعد جاي. دوس ＋ باش تزيد واحد.';
      nextBox.appendChild(e);
    }

    var listBox = $('listBox');
    listBox.innerHTML = '';
    var rest = arr.filter(function (x) { return upcoming.length ? x.id !== upcoming[0].id : true; });
    if (!rest.length) {
      var e2 = document.createElement('div');
      e2.className = 'card empty';
      e2.textContent = upcoming.length ? 'هادشي هو الوحيد اللي عندك.' : 'اللائحة خاوية.';
      listBox.appendChild(e2);
    } else {
      rest.forEach(function (it) { listBox.appendChild(card(it, false)); });
    }
  }

  /* add sheet */
  function openSheet() {
    var d = new Date();
    $('d').value = d.toISOString().slice(0, 10);
    $('h').value = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    $('t').value = ''; $('n').value = '';
    $('sheet').classList.add('on');
    setTimeout(function () { $('t').focus(); }, 150);
  }
  $('addBtn').onclick = openSheet;
  $('closeBtn').onclick = function () { $('sheet').classList.remove('on'); };

  Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function (b) {
    b.onclick = function () {
      var map = { pill: 'حبة الدواء 💊', doc: 'موعد عند الطبيب 🩺', fam: 'زيارة العائلة 👨‍👩‍👦', eat: 'وقت الماكلة 🍲' };
      $('t').value = map[b.getAttribute('data-q')] || '';
      $('t').focus();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (b) {
    b.onclick = function () {
      var mins = parseInt(b.getAttribute('data-w'), 10);
      var d = new Date(Date.now() + mins * 60000);
      $('d').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      $('h').value = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    };
  });

  $('saveBtn').onclick = function () {
    var title = $('t').value.trim();
    if (!title) { $('t').focus(); return; }
    var dstr = $('d').value, hstr = $('h').value || '12:00';
    var ts = Date.now();
    if (dstr) {
      var parts = dstr.split('-'), hp = hstr.split(':');
      ts = new Date(+parts[0], +parts[1] - 1, +parts[2], +hp[0], +hp[1] || 0).getTime();
    }
    items.push({ id: 'm' + Date.now(), title: title, note: $('n').value.trim(), ts: ts, done: false });
    save(); render();
    $('sheet').classList.remove('on');
    if ('speechSynthesis' in window) speak('تسجل الموعد: ' + title);
  };

  /* reminders check */
  function tick() {
    var now = Date.now();
    items.forEach(function (it) {
      if (it.done) return;
      if (it.ts <= now && !spoken[it.id]) {
        spoken[it.id] = true;
        $('ringTitle').textContent = it.title;
        $('ringNote').textContent = fmtDay(it.ts) + ' · ' + fmtTime(it.ts);
        $('ring').classList.add('on');
        speak('تذكير: ' + it.title);
        it.done = true; save();
      }
    });
  }
  $('ringOk').onclick = function () {
    $('ring').classList.remove('on');
    try { window.speechSynthesis.cancel(); } catch (e) {}
    render();
  };

  load();
  render();
  setInterval(tick, 5000);
  tick();
})();
</script>
</body>
</html>
