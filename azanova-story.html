<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

/* ---------------- audio (synthesized, no files) ---------------- */
const Sfx = (() => {
  let ctx = null, master = null, muted = false, noiseBuf = null;

  function init() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.5;
    master.connect(ctx.destination);
    const len = Math.floor(ctx.sampleRate * 1.2);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function env(gainNode, t0, peak, attack, decay) {
    gainNode.gain.setValueAtTime(0.0001, t0);
    gainNode.gain.exponentialRampToValueAtTime(peak, t0 + attack);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  }
  function tone(type, f0, f1, dur, peak, attack = 0.006) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    env(g, t0, peak, attack, dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function human(pitch, dur, peak, formant, vib, growl) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(pitch * 1.22, t0);
    o.frequency.exponentialRampToValueAtTime(pitch * 0.92, t0 + dur);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = formant; bp.Q.value = 5.5;
    const bp2 = ctx.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = formant * 2.4; bp2.Q.value = 7;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.035);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const lfo = ctx.createOscillator(); lfo.frequency.value = vib || 16;
    const lg = ctx.createGain(); lg.gain.value = pitch * (growl ? 0.16 : 0.07);
    lfo.connect(lg); lg.connect(o.frequency);
    o.connect(bp); bp.connect(lp); bp2.connect(lp); o.connect(bp2); lp.connect(g); g.connect(master);
    o.start(t0); lfo.start(t0);
    o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
  }

  function noise(dur, peak, filterType, f0, f1, q = 1) {
    if (!ctx || muted || !noiseBuf) return;
    const t0 = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = filterType; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
    const g = ctx.createGain(); env(g, t0, peak, 0.004, dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur + 0.05);
  }

  return {
    init, resume,
    get muted() { return muted; },
    toggle() { muted = !muted; if (ctx) master.gain.value = muted ? 0 : 0.5; return muted; },
    shoot() { tone('square', 620, 90, 0.11, 0.16); noise(0.08, 0.10, 'highpass', 1600, 700, 0.7); },
    hit() { tone('sine', 1150, 1750, 0.07, 0.09); },
    kill() { noise(0.35, 0.20, 'lowpass', 1400, 120, 0.8); tone('sine', 150, 45, 0.32, 0.22); },
    jump() { tone('sine', 320, 720, 0.16, 0.10, 0.01); },
    land() { noise(0.11, 0.10, 'lowpass', 500, 160, 1.1); },
    step() { noise(0.055, 0.035, 'bandpass', 260, 180, 1.4); },
    hurt() { tone('sawtooth', 240, 110, 0.16, 0.12); },
    wave() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone('triangle', f, f, 0.16, 0.10), i * 95)); },
    over() { [440, 349, 262, 196].forEach((f, i) => setTimeout(() => tone('triangle', f, f * 0.98, 0.34, 0.13), i * 150)); },
    ui() { tone('triangle', 700, 900, 0.05, 0.07); },
    shout() { human(132 + Math.random() * 26, 0.14, 0.16, 780, 20, false); },
    effort() { human(118 + Math.random() * 20, 0.18, 0.15, 560, 14, false); },
    hurtVoice() { human(150 + Math.random() * 30, 0.22, 0.17, 900, 24, true); },
    botScreech() { tone('square', 1400, 220, 0.22, 0.10); noise(0.26, 0.13, 'highpass', 2400, 600, 0.9); },
    bossRoar() { human(72, 0.75, 0.28, 320, 9, true); noise(0.8, 0.16, 'lowpass', 900, 90, 0.7); }
  };
})();

/* ---------------- character voices (speech synthesis, multi-language) ---------------- */
const LANG_KEY = 'azanova-lang';
const LANGS = [
  { code: 'ar', label: 'ع', name: 'الدارجة' },
  { code: 'fr', label: 'FR', name: 'Français' },
  { code: 'en', label: 'EN', name: 'English' }
];
let uiLang = localStorage.getItem(LANG_KEY) || 'ar';
if (!LANGS.some(l => l.code === uiLang)) uiLang = 'ar';

const Voice = (() => {
  const synth = window.speechSynthesis || null;
  let enabled = !!synth;
  let voices = [];

  function loadVoices() {
    if (!synth || !synth.getVoices) return;
    voices = synth.getVoices() || [];
  }
  loadVoices();
  if (synth && 'onvoiceschanged' in synth) {
    synth.onvoiceschanged = loadVoices;
  }

  function findVoice(langCode) {
    if (!voices.length) loadVoices();
    const exact = voices.find(v => new RegExp('^' + langCode + '[-_]MA', 'i').test(v.lang));
    if (exact) return exact;
    const base = voices.find(v => new RegExp('^' + langCode, 'i').test(v.lang));
    if (base) return base;
    if (langCode === 'ar') {
      return voices.find(v => /arabic/i.test(v.name)) || null;
    }
    return null;
  }

  return {
    get enabled() { return enabled; },
    get availableLanguages() {
      if (!voices.length) loadVoices();
      return LANGS.filter(l => !!findVoice(l.code)).map(l => l.code);
    },
    hasVoiceFor(code) { return !!findVoice(code); },
    toggle() {
      enabled = !enabled;
      if (!enabled && synth) { try { synth.cancel(); } catch (e) {} }
      return enabled;
    },
    stop() { if (synth) { try { synth.cancel(); } catch (e) {} } },
    speak(line, who, langCode) {
      if (!synth || !enabled || !line) return;
      const text = (langCode !== 'ar' && line[langCode]) ? line[langCode] : line.text;
      if (!text) return;
      try { synth.cancel(); } catch (e) {}
      const v = findVoice(langCode);
      const u = new SpeechSynthesisUtterance(text);
      if (v) { u.voice = v; u.lang = v.lang; }
      else { u.lang = langCode === 'ar' ? 'ar' : (langCode === 'fr' ? 'fr-FR' : 'en-US'); }
      u.rate = who === 'salma' ? 1.02 : who === 'karim' ? 0.86 : 0.95;
      u.pitch = who === 'salma' ? 1.25 : who === 'karim' ? 0.7 : 1.0;
      u.volume = 1;
      try { synth.speak(u); } catch (e) {}
    }
  };
})();

/* ---------------- scene ---------------- */
const scene = new THREE.Scene();
const SKY = 0x9fd2e6;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 42, 135);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff4ff, 0x4a4830, 1.9));

const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(-24, 38, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0008;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(320, 320),
  new THREE.MeshStandardMaterial({ color: 0x8b917a, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(220, 72, 0x3f6b73, 0x6b7a72);
grid.position.y = 0.015;
grid.material.transparent = true;
grid.material.opacity = 0.2;
scene.add(grid);

function box(x, y, z, sx, sy, sz, color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
  );
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

const WORLD = 112;
const covers = [];
for (let i = 0; i < 58; i++) {
  const x = (Math.random() - 0.5) * 118;
  const z = (Math.random() - 0.5) * 118;
  if (Math.abs(x) < 8 && Math.abs(z) < 14) continue;
  const h = 2 + Math.random() * 8;
  const sx = 3 + Math.random() * 5, sz = 3 + Math.random() * 5;
  const b = box(x, h / 2, z, sx, h, sz, [0x606a70, 0x777b75, 0x565f68, 0x9a927d][i % 4]);
  covers.push({ x, z, r: Math.max(sx, sz) * 0.5 + 0.55 });
  if (Math.random() > 0.55) box(x, h + 0.08, z, sx * 0.7, 0.16, sz * 0.7, 0x243c46);
}

/* ---------------- player ---------------- */
const player = new THREE.Group();
scene.add(player);
const body = new THREE.Group();
player.add(body);

const suit = new THREE.MeshStandardMaterial({ color: 0x1b2f44, metalness: 0.55, roughness: 0.34 });
const armor = new THREE.MeshStandardMaterial({ color: 0x18d5e9, metalness: 0.65, roughness: 0.22, emissive: 0x0a4854, emissiveIntensity: 0.35 });
const dark = new THREE.MeshStandardMaterial({ color: 0x111820, metalness: 0.4 });
const skin = new THREE.MeshStandardMaterial({ color: 0xc99870 });

function part(parent, geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  parent.add(m);
  return m;
}

const cyanGlow = new THREE.MeshStandardMaterial({ color: 0x39f2ff, emissive: 0x25e8ff, emissiveIntensity: 1.7, metalness: 0.4, roughness: 0.22 });
const boot = new THREE.MeshStandardMaterial({ color: 0x0e1620, metalness: 0.6, roughness: 0.4 });

// torso + chest armor
const torso = part(body, new THREE.CapsuleGeometry(0.4, 0.8, 6, 14), suit, 0, 1.3, 0);
part(body, new THREE.BoxGeometry(0.92, 0.56, 0.52), armor, 0, 1.5, -0.02);
part(body, new THREE.BoxGeometry(0.5, 0.12, 0.06), cyanGlow, 0, 1.62, -0.29);
part(body, new THREE.SphereGeometry(0.1, 12, 10), cyanGlow, 0, 1.44, -0.28);

/* ---------- realistic hero model (rigged, animated) ---------- */
const hero = { model: null, mixer: null, actions: {}, current: '', ready: false };

function setupHero(gltf) {
  const model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
      if (o.material) o.material.envMapIntensity = 0.6;
    }
  });
  model.scale.setScalar(1.18);
  model.rotation.y = Math.PI;
  body.visible = false;
  player.add(model);
  hero.model = model;
  hero.mixer = new THREE.AnimationMixer(model);
  const pick = n => gltf.animations.find(c => c.name === n);
  [['idle', 'Idle'], ['walk', 'Walk'], ['run', 'Run']].forEach(([k, n]) => {
    const clip = pick(n);
    if (!clip) return;
    const a = hero.mixer.clipAction(clip);
    a.enabled = true;
    a.setEffectiveWeight(k === 'idle' ? 1 : 0);
    a.play();
    hero.actions[k] = a;
  });
  hero.current = 'idle';
  hero.ready = true;
}

function setHeroState(name) {
  if (!hero.ready || hero.current === name) return;
  const from = hero.actions[hero.current], to = hero.actions[name];
  if (to) {
    to.reset().setEffectiveWeight(1).play();
    if (from) from.crossFadeTo(to, 0.22, false);
    hero.current = name;
  }
}

new GLTFLoader().load('./models/Soldier.glb', setupHero, undefined, err => {

});

function spawnRing(n, minD, maxD) {
  for (let i = 0; i < n; i++) {
    let x, z, tries = 0;
    do {
      const a = Math.random() * Math.PI * 2, d = minD + Math.random() * (maxD - minD);
      x = player.position.x + Math.cos(a) * d;
      z = player.position.z + Math.sin(a) * d;
      tries++;
    } while ((Math.abs(x) > WORLD || Math.abs(z) > WORLD) && tries < 25);
    createBot(THREE.MathUtils.clamp(x, -WORLD, WORLD), THREE.MathUtils.clamp(z, -WORLD, WORLD));
  }
}

function spawnWave(n) {
  for (let i = 0; i < n; i++) {
    let x, z, tries = 0;
    do {
      const a = Math.random() * Math.PI * 2, d = 22 + Math.random() * 26;
      x = player.position.x + Math.cos(a) * d;
      z = player.position.z + Math.sin(a) * d;
      tries++;
    } while ((Math.abs(x) > WORLD || Math.abs(z) > WORLD) && tries < 20);
    createBot(THREE.MathUtils.clamp(x, -WORLD, WORLD), THREE.MathUtils.clamp(z, -WORLD, WORLD));
  }
}

function burst(pos, color, count = 10, power = 5) {
  let used = 0;
  for (const p of particlePool) {
    if (p.life > 0) continue;
    p.m.position.copy(pos);
    p.m.material.color.setHex(color);
    p.m.scale.setScalar(0.7 + Math.random());
    p.v.set((Math.random() - 0.5) * power, Math.random() * power * 0.9 + 1, (Math.random() - 0.5) * power);
    p.life = p.max = 0.45 + Math.random() * 0.35;
    p.m.visible = true;
    if (++used >= count) break;
  }
}

function bindHold(id, key) {
  const el = document.getElementById(id);
  const on = e => {
    e.preventDefault(); keys[key] = true; el.classList.add('press');
    if (el.setPointerCapture && e.pointerId !== undefined) { try { el.setPointerCapture(e.pointerId); } catch (_) {} }
  };
  const off = () => { keys[key] = false; el.classList.remove('press'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, off));
}
bindHold('left', 'left'); bindHold('right', 'right');
bindHold('forward', 'forward'); bindHold('back', 'back');

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (k === 'w' || k === 'arrowup') keys.forward = true;
  if (k === 's' || k === 'arrowdown') keys.back = true;
  if (k === 'a' || k === 'arrowleft') keys.left = true;
  if (k === 'd' || k === 'arrowright') keys.right = true;
  if (k === ' ') doJump();
  if (k === 'f') doFire();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') keys.forward = false;
  if (k === 's' || k === 'arrowdown') keys.back = false;
  if (k === 'a' || k === 'arrowleft') keys.left = false;
  if (k === 'd' || k === 'arrowright') keys.right = false;
});

});

function doJump() {
  if (!started || over) return;
  if (onGround || coyote > 0) {
    vy = 7.4; onGround = false; coyote = 0;
    Sfx.jump();
    Sfx.effort();
    burst(new THREE.Vector3(player.position.x, 0.08, player.position.z), 0xd8d2b0, 5, 2.2);
  }
}

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

function doFire() {
  if (!started || over || fireCooldown > 0) return;
  fireCooldown = 0.28;
  Sfx.shoot();
  if (Math.random() < 0.55) Sfx.shout();
  flash.visible = true;
  setTimeout(() => { flash.visible = false; }, 55);
  shake = Math.min(shake + 0.12, 0.5);

  const origin = muzzle.getWorldPosition(_v1).clone();
  const dir = _v2.set(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();

  let target = null, bestDist = 26;
  for (const b of bots) {
    if (!b.alive) continue;
    const to = _v3.copy(b.g.position).setY(1.1).sub(origin);
    const dist = to.length();
    if (dist > 26) continue;
    const dot = to.clone().normalize().dot(dir);
    if (dot > 0.965 && dist < bestDist) { bestDist = dist; target = b; }
  }

  const end = target
    ? target.g.position.clone().setY(1.15)
    : origin.clone().addScaledVector(dir, 26);

  tracerGeo.setFromPoints([origin, end]);
  tracer.material.opacity = 0.95;
  tracerLife = 0.09;

  if (target) {
    target.hp -= 55;
    target.flash = 0.14;
    burst(end, 0xff7a86, 6, 3.4);
    Sfx.hit();
    if (target.hp <= 0) {
      target.alive = false;
      burst(target.g.position.clone().setY(1.1), 0xff5566, 18, 6);
      burst(target.g.position.clone().setY(1.1), 0xffd166, 8, 4);
      scene.remove(target.g);
      kills++;
      document.getElementById('kills').textContent = kills;
      Sfx.kill();
      if (target.boss) { Sfx.bossRoar(); shake = Math.min(shake + 0.55, 1); }
      else { Sfx.botScreech(); shake = Math.min(shake + 0.3, 0.7); }
      showMessage('TARGET DOWN');
      if (bots.every(b => !b.alive)) setTimeout(() => levelClear(), 700);
    }
  }
}

function nextWave() {
  levelClear();
}

let msgTimer = 0;
function showMessage(text) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.classList.add('on');
  msgTimer = 1.1;
}

/* ---------------- damage / game over ---------------- */
function damage(amount) {
  if (!started || over) return;
  health = Math.max(0, health - amount);
  const hEl = document.getElementById('health');
  hEl.textContent = Math.round(health);
  document.getElementById('hpfill').style.width = health + '%';
  document.getElementById('hpfill').style.background =
    health > 55 ? 'linear-gradient(90deg,#55ff9b,#1bd6a6)' :
    health > 25 ? 'linear-gradient(90deg,#ffd166,#ff9f43)' :
    'linear-gradient(90deg,#ff6b6b,#c92a2a)';
  if (hurtTimer <= 0) { Sfx.hurt(); Sfx.hurtVoice(); shake = Math.min(shake + 0.18, 0.6); }
  hurtTimer = 0.35;
  if (health <= 0) gameOver();
}

function gameOver() {
  over = true;
  Voice.stop();
  started = false;
  paused = true;
  Sfx.over();
  document.getElementById('overline').textContent =
    'طاح ياسين فالفصل ' + (levelIndex + 1) + ' · ' + kills + ' إقصاءات. عاود المحاولة.';
  document.getElementById('over').style.display = 'flex';
}

      { who: 'yassine', text: 'كريم. جا هو بنفسو.', fr: 'Karim. Il est venu lui-même.', en: 'Karim. He came himself.' }
    ]
  },
  {

    place: 'CORE CHAMBER · 06:20',
    goal: 'اقضِ على كريم',
    bots: 4, minD: 18, maxD: 28, boss: true, hp: 100,
    intro: [
      { who: 'karim', text: 'ياسين. كنتي أحسن واحد دربتو. علاش خنتي الفريق؟', fr: 'Yassine. Tu étais le meilleur que j\'ai formé. Pourquoi as-tu trahi l\'équipe ?', en: 'Yassine. You were the best I ever trained. Why did you betray the team?' },
      { who: 'yassine', text: 'أنا ما خنتش حد. نتا اللي بعت البلاد مقابل السلطة.', fr: 'Je n\'ai trahi personne. C\'est toi qui as vendu le pays pour le pouvoir.', en: 'I never betrayed anyone. You\'re the one who sold the country for power.' },
      { who: 'salma', text: 'ياسين، درعه كيتشحن! تحرك، ماتبقاش واقف قدامو!', fr: 'Yassine, son armure se charge ! Bouge, ne reste pas planté devant lui !', en: 'Yassine, his armor is charging! Move, don\'t stand in front of him!' }
    ],
    outro: [

      { who: 'salma', text: 'ياسين؟ ياسين، جاوبني! … رجع الصوت. رجع الصوت!', fr: 'Yassine ? Yassine, réponds-moi ! … Le son revient. Le son revient !', en: 'Yassine? Yassine, answer me! … Sound is back. Sound is back!' },
      { who: 'yassine', text: 'أنا هنا. الحمد لله. … سلمى، خلصنا؟', fr: 'Je suis là. Dieu merci. … Salma, c\'est fini ?', en: 'I\'m here. Thank God. … Salma, are we done?' }

/* ---------- dialogue engine ---------- */
let dlgQueue = [], dlgDone = null;
const dlgEl = document.getElementById('dlg');
const portEl = document.getElementById('dlg-port');
const nameEl = document.getElementById('dlg-name');
const textEl = document.getElementById('dlg-text');

function playDialogue(lines, onDone) {
  if (!lines || !lines.length) { if (onDone) onDone(); return; }
  paused = true;
  dlgQueue = lines.slice();
  dlgDone = onDone;
  dlgEl.classList.add('show');
  nextLine();
}

function nextLine() {
  const line = dlgQueue.shift();
  if (!line) {
    dlgEl.classList.remove('show');
    Voice.stop();
    const cb = dlgDone; dlgDone = null;
    paused = false;
    if (cb) cb();
    return;
  }
  currentLine = line;
  const who = CAST[line.who] || CAST.yassine;
  portEl.src = who.img;
  portEl.alt = who.name;
  nameEl.textContent = who.name;
  const extra = (uiLang !== 'ar' && line[uiLang]) ? line[uiLang] : '';
  textEl.innerHTML = extra
    ? line.text + '<br><span style="color:#8fd6e8;font-size:12px;opacity:.9">' + extra + '</span>'
    : line.text;
  Sfx.ui();
  Voice.speak(line, line.who, uiLang);
}

document.getElementById('dlg-next').addEventListener('click', nextLine);

const voiceBtn = document.getElementById('dlg-voice');
voiceBtn.classList.toggle('off', !Voice.enabled);
voiceBtn.addEventListener('click', e => {
  e.stopPropagation();
  const on = Voice.toggle();
  voiceBtn.classList.toggle('off', !on);
  if (!on) Voice.stop();
  else if (dlgEl.classList.contains('show')) replayCurrent();
});

const langBtn = document.getElementById('dlg-lang');
function paintLang() {
  const l = LANGS.find(x => x.code === uiLang);
  langBtn.textContent = l ? l.label : 'ع';
  langBtn.title = 'لغة الصوت: ' + (l ? l.name : 'العربية');
}
paintLang();
langBtn.addEventListener('click', e => {
  e.stopPropagation();
  const i = LANGS.findIndex(x => x.code === uiLang);
  uiLang = LANGS[(i + 1) % LANGS.length].code;
  localStorage.setItem(LANG_KEY, uiLang);
  paintLang();
  Sfx.ui();
  replayCurrent();
});

let currentLine = null;
function replayCurrent() {
  if (!currentLine || !dlgEl.classList.contains('show')) return;
  Voice.stop();
  Voice.speak(currentLine, currentLine.who, uiLang);
}

/* ---------- level flow ---------- */
function setObjective(text) {
  document.getElementById('objective').innerHTML =
    '<span class="badge">' + LEVELS[levelIndex].name.split('—')[0].trim() + '</span><br>' + text;
}

function startLevel(i) {
  levelIndex = THREE.MathUtils.clamp(i, 0, LEVELS.length - 1);
  const L = LEVELS[levelIndex];
  victory = false; over = false; started = false; paused = true;
  clearBots();
  health = L.hp; kills = 0; wave = levelIndex + 1;
  fireCooldown = 0; vy = 0; onGround = true; vel.set(0, 0);
  yaw = 0; camYaw = 0; camPitch = 0.14;
  player.position.set(0, 0, 6);
  player.rotation.set(0, 0, 0);
  body.position.y = 0;
  shadowHealth();

  document.getElementById('wave').textContent = (levelIndex + 1) + '/' + LEVELS.length;
  document.getElementById('kills').textContent = '0';
  document.getElementById('over').style.display = 'none';
  setObjective(L.goal + ' · ' + L.place);
  showMessage(L.name);

  playDialogue(L.intro, () => {
    started = true;
    paused = false;
    spawnRing(L.bots, L.minD, L.maxD);
    if (L.boss) {
      setTimeout(() => {
        if (over) return;
        createBot(player.position.x + 10, player.position.z - 24, { boss: true });
        showMessage('القائد كريم دخل الساحة!');
        Sfx.wave();
      }, 900);
    }
  });
}

function levelClear() {
  if (victory || over) return;
  started = false;
  paused = true;
  const L = LEVELS[levelIndex];
  Sfx.wave();
  playDialogue(L.outro, () => {
    if (levelIndex >= LEVELS.length - 1) {
      showVictory();
    } else {
      startLevel(levelIndex + 1);
    }
  });
}

function showVictory() {
  victory = true; started = false; paused = true;
  Sfx.wave();
  document.getElementById('over').querySelector('h1').textContent = 'خلصت القصة 🎉';
  document.getElementById('overline').textContent =
    'ياسين نجا. كامل الفصول 4 كملو ب ' + kills + ' إقصاءات فالفصل الأخير.';
  document.getElementById('again').textContent = 'عاود من الأول';
  document.getElementById('over').style.display = 'flex';
}

function shadowHealth() {
  document.getElementById('health').textContent = Math.round(health);
  const f = document.getElementById('hpfill');
  f.style.width = health + '%';
  f.style.background = 'linear-gradient(90deg,#55ff9b,#1bd6a6)';
}

document.getElementById('play').addEventListener('click', () => {
  Sfx.init(); Sfx.resume(); Sfx.ui();
  document.getElementById('start').style.display = 'none';
  document.getElementById('again').textContent = 'عاود المحاولة';
  startLevel(0);
});

document.getElementById('again').addEventListener('click', () => {
  Sfx.resume(); Sfx.ui();
  document.getElementById('again').textContent = 'عاود المحاولة';
  startLevel(victory ? 0 : levelIndex);
});

/* ---------------- update ---------------- */
const SPEED = 8.4, ACCEL = 46, FRICTION = 12;

function resolveCover(pos) {
  for (const c of covers) {
    const dx = pos.x - c.x, dz = pos.z - c.z;
    const d = Math.hypot(dx, dz);
    if (d < c.r && d > 0.0001) {
      const push = (c.r - d);
      pos.x += (dx / d) * push;
      pos.z += (dz / d) * push;
    }
  }
}

function updateMovement(dt) {
  if (keys.left) camYaw += 2.4 * dt;
  if (keys.right) camYaw -= 2.4 * dt;

  // smooth turn toward camera direction
  let dy = ((camYaw - yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  yaw += dy * Math.min(1, dt * 12);

  const forward = new THREE.Vector2(-Math.sin(yaw), -Math.cos(yaw));
  const right = new THREE.Vector2(Math.cos(yaw), -Math.sin(yaw));
  const wish = new THREE.Vector2(0, 0);
  if (keys.forward) wish.add(forward);
  if (keys.back) wish.sub(forward);
  if (keys.right) wish.add(right);
  if (keys.left) wish.sub(right);

  if (wish.lengthSq() > 0) {
    wish.normalize().multiplyScalar(SPEED);
    vel.x += (wish.x - vel.x) * Math.min(1, dt * (ACCEL / SPEED));
    vel.y += (wish.y - vel.y) * Math.min(1, dt * (ACCEL / SPEED));
  } else {
    const damp = Math.max(0, 1 - FRICTION * dt);
    vel.multiplyScalar(damp);
  }

  player.position.x += vel.x * dt;
  player.position.z += vel.y * dt;
  resolveCover(player.position);
  player.position.x = THREE.MathUtils.clamp(player.position.x, -WORLD, WORLD);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -WORLD, WORLD);

  // gravity with coyote time
  if (onGround) coyote = 0.12; else coyote = Math.max(0, coyote - dt);
  vy -= 21 * dt;
  player.position.y += vy * dt;
  if (player.position.y <= 0) {
    if (!onGround && vy < -6) { Sfx.land(); burst(new THREE.Vector3(player.position.x, .05, player.position.z), 0xd8d2b0, 5, 2); }
    player.position.y = 0; vy = 0; onGround = true;
  } else onGround = false;

  // body animation
  const speed = vel.length();
  const norm = Math.min(1, speed / SPEED);
  player.rotation.y = yaw;
  setHeroState(norm > 0.55 ? 'run' : norm > 0.06 ? 'walk' : 'idle');
  if (hero.actions.walk) hero.actions.walk.timeScale = 0.9 + norm * 0.9;
  if (hero.actions.run) hero.actions.run.timeScale = 0.85 + norm * 0.6;
  if (norm > 0.05 && onGround) {
    walkPhase += dt * (7 + norm * 7);
    const swing = Math.sin(walkPhase) * 0.62 * norm;
    legL.rotation.x = swing;
    legR.rotation.x = -swing;
    armL.rotation.x = -swing * 0.75;
    armR.rotation.x = swing * 0.4;
    body.position.y = Math.abs(Math.sin(walkPhase)) * 0.045;
    torso.rotation.z = Math.sin(walkPhase) * 0.045 * norm;
    stepTimer -= dt;
    if (stepTimer <= 0) { Sfx.step(); stepTimer = 0.34 - norm * 0.1; }
  } else {
    walkPhase = 0;
    legL.rotation.x = THREE.MathUtils.lerp(legL.rotation.x, 0, dt * 8);
    legR.rotation.x = THREE.MathUtils.lerp(legR.rotation.x, 0, dt * 8);
    armL.rotation.x = THREE.MathUtils.lerp(armL.rotation.x, 0, dt * 8);
    armR.rotation.x = THREE.MathUtils.lerp(armR.rotation.x, -0.5, dt * 8);
    torso.rotation.z = THREE.MathUtils.lerp(torso.rotation.z, 0, dt * 8);
    body.position.y = THREE.MathUtils.lerp(body.position.y, 0, dt * 8);
  }
  // lean into turns
  const strafe = vel.dot(new THREE.Vector2(Math.cos(yaw), -Math.sin(yaw)));
  player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -strafe * 0.012, dt * 6);
}

function updateBots(dt) {
  for (const b of bots) {
    if (!b.alive) continue;
    b.phase += dt * 2.2;
    const dx = player.position.x - b.g.position.x;
    const dz = player.position.z - b.g.position.z;
    const dist = Math.hypot(dx, dz);

    if (dist > 2.4 && dist < 42) {
      const spd = 1.9 + wave * 0.12;
      b.g.position.x += (dx / dist) * spd * dt;
      b.g.position.z += (dz / dist) * spd * dt;
    }
    const targetRot = Math.atan2(dx, dz);
    let rd = ((targetRot - b.g.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    b.g.rotation.y += rd * Math.min(1, dt * 5);

    b.g.position.y = Math.sin(b.phase) * 0.09;
    b.g.rotation.z = Math.sin(b.phase * 0.7) * 0.05;

    if (b.flash > 0) {
      b.flash -= dt;
      b.glowMat.emissiveIntensity = 2.6;
      b.glowMat.color.setHex(0xff9aa5);
      b.glowCore.emissiveIntensity = 3;
    } else {
      b.glowMat.emissiveIntensity = 0.9 + Math.sin(b.phase * 1.6) * 0.18;
      b.glowMat.color.setHex(0xb52f42);
      b.glowCore.emissiveIntensity = 1.1 + Math.sin(b.phase * 2.2) * 0.35;
    }

    const stride = Math.sin(b.phase * 2.2) * 0.42;
    if (b.legL) { b.legL.rotation.x = stride; b.legR.rotation.x = -stride; }

    if (dist < 1.75) damage(14 * dt);
  }
}

const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3(0, 5, 14);

function updateCamera(dt) {
  const cy = camYaw;
  const dist = 7.4, height = 3.5 + camPitch * 7;
  const desired = new THREE.Vector3(
    player.position.x + Math.sin(cy) * dist * Math.cos(camPitch * 0.5),
    player.position.y + height,
    player.position.z + Math.cos(cy) * dist * Math.cos(camPitch * 0.5)
  );
  camPos.lerp(desired, Math.min(1, dt * 6.5));

  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.2);
    camPos.x += (Math.random() - 0.5) * shake * 0.6;
    camPos.y += (Math.random() - 0.5) * shake * 0.6;
  }
  camera.position.copy(camPos);
  camTarget.set(player.position.x, player.position.y + 1.5, player.position.z);
  camera.lookAt(camTarget);
}

function updateParticles(dt) {
  for (const p of particlePool) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.m.visible = false; continue; }
    p.v.y -= 14 * dt;
    p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.05) { p.m.position.y = 0.05; p.v.multiplyScalar(0.45); p.v.y = Math.abs(p.v.y) * 0.35; }
    p.m.material.opacity = p.life / p.max;
    p.m.scale.setScalar(0.4 + (p.life / p.max) * 0.9);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (started && !over && !paused) {
    updateMovement(dt);
    updateBots(dt);
    fireCooldown = Math.max(0, fireCooldown - dt);
    hurtTimer = Math.max(0, hurtTimer - dt);
  }
  updateParticles(dt);
  if (hero.mixer) hero.mixer.update(dt);
  updateCamera(dt);

  if (tracerLife > 0) {
    tracerLife -= dt;
    tracer.material.opacity = Math.max(0, tracerLife / 0.09) * 0.95;
  }
  if (msgTimer > 0) {
    msgTimer -= dt;
    if (msgTimer <= 0) document.getElementById('message').classList.remove('on');
  }
  if (flash.visible && !started) flash.visible = false;

  renderer.render(scene, camera);
}

camera.position.copy(camPos);
camera.lookAt(0, 1.5, 0);
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
